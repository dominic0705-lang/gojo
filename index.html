<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咒術迴戰：死滅迴游 - 東京第一結界</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #010101;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white; user-select: none;
        }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; transition: opacity 0.5s; }
        .panel {
            background: rgba(5, 2, 10, 0.85); border: 1px solid rgba(170, 50, 255, 0.3);
            border-radius: 8px; padding: 15px; backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(170, 50, 255, 0.1); transition: all 0.5s;
        }
        #top-left { position: absolute; top: 20px; left: 20px; display: none; }
        
        #gear-btn {
            position: absolute; top: 20px; right: 20px; font-size: 28px; cursor: pointer;
            pointer-events: auto; text-shadow: 0 0 10px #aa33ff; display: none;
            transition: transform 0.3s ease;
        }
        #gear-btn:hover { transform: rotate(90deg) scale(1.1); }
        
        #restore-btn {
            position: absolute; top: 20px; right: 65px; font-size: 28px; cursor: pointer;
            pointer-events: auto; text-shadow: 0 0 10px #00ffcc; display: none;
            transition: transform 0.3s ease;
        }
        #restore-btn:hover { transform: rotate(-90deg) scale(1.1); }
        
        #settings-modal {
            position: absolute; top: 60px; right: 20px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 10px; display: none;
            transform-origin: top right; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #bottom-center { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; display: none; }
        
        h1 { margin: 0 0 5px 0; font-size: 22px; color: #fff; text-shadow: 0 0 15px #aa33ff; letter-spacing: 2px; }
        p { margin: 5px 0; font-size: 14px; color: #aaa; }
        .highlight { color: #cc66ff; font-weight: bold; text-shadow: 0 0 8px #aa33ff; }
        
        #skill-announce {
            position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%) scale(0.5);
            font-size: 45px; font-weight: 900; color: #fff; letter-spacing: 12px;
            opacity: 0; pointer-events: none; z-index: 20;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap; font-style: italic;
        }
        #skill-announce.show { transform: translateX(-50%) scale(1); opacity: 1; }

        .skill-box {
            position: relative; width: 65px; height: 65px; background: rgba(5, 0, 10, 0.7);
            border: 2px solid #324; border-radius: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-size: 13px; font-weight: bold;
            transition: all 0.2s; color: #888; overflow: hidden; pointer-events: auto; cursor: pointer;
        }
        .skill-box.active {
            border-color: #aa55ff; color: #fff; background: rgba(50, 0, 100, 0.8);
            box-shadow: 0 0 25px rgba(170, 80, 255, 0.9); transform: translateY(-10px) scale(1.1);
        }
        .skill-box.on-cd { border-color: #222; color: #444; pointer-events: none; }
        .skill-key { color: #cc88ff; font-size: 14px; margin-bottom: 4px; background: rgba(170, 50, 255, 0.2); padding: 2px 6px; border-radius: 4px; z-index: 2; }
        .skill-name { z-index: 2; text-align: center; }
        
        .cd-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(0, 0, 0, 0.8); z-index: 1; transition: height 0.1s linear; }
        .cd-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: bold; color: #ff3333; z-index: 3; display: none; text-shadow: 0 0 5px #000; }

        select { background: #0a0512; color: #aa55ff; border: 1px solid #aa55ff; padding: 6px; border-radius: 4px; outline: none; cursor: pointer; font-size: 13px; }
        
        #domain-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; opacity: 0; transition: opacity 0.1s; pointer-events: none; z-index: 5; mix-blend-mode: overlay; }

        .domain-ui-mode .panel { background: rgba(0, 5, 20, 0.2); border-color: rgba(170, 0, 255, 0.5); box-shadow: 0 0 30px rgba(170, 0, 255, 0.2); }
        .domain-ui-mode h1 { color: #ddddff; text-shadow: 0 0 15px #aa00ff; letter-spacing: 5px; }

        #intro-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 2, 8, 0.95); z-index: 50; display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(10px);
        }
        .intro-title { font-size: 52px; color: #fff; text-shadow: 0 0 20px #8800ff, 0 0 40px #aa00ff; letter-spacing: 8px; margin-bottom: 20px; text-align: center; }
        .intro-subtitle { font-size: 24px; color: #cc66ff; margin-bottom: 30px; letter-spacing: 4px; }
        .intro-desc { color: #999; font-size: 16px; max-width: 650px; text-align: center; line-height: 1.8; margin-bottom: 40px; border-left: 3px solid #aa00ff; padding-left: 15px; }
        
        #start-btn {
            padding: 15px 40px; font-size: 24px; font-weight: bold; color: #000;
            background: #aa33ff; border: none; border-radius: 4px; cursor: pointer;
            box-shadow: 0 0 20px rgba(170, 50, 255, 0.6), inset 0 0 10px rgba(255,255,255,0.4);
            transition: all 0.2s; position: relative;
        }
        #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 35px rgba(170, 50, 255, 1), inset 0 0 15px rgba(255,255,255,0.8); }

        .shard { position: absolute; pointer-events: none; box-shadow: 0 0 15px var(--glow-color), inset 0 0 10px rgba(255,255,255,0.8); animation: shatterAnim 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; z-index: 51; }

        @keyframes shatterAnim { 0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; filter: brightness(2); } 100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.2); opacity: 0; filter: brightness(1); } }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>
    <div id="domain-overlay"></div>

    <div id="intro-screen">
        <div class="intro-title">死滅迴游</div>
        <div class="intro-subtitle">東京第一結界</div>
        <div class="intro-desc">
            結界內的空間已被封鎖，整齊的現代都會化為空無一人的死城。<br>
            十字路口的號誌依舊閃爍，但空氣中瀰漫著詭異的平靜。<br>
            少量戰鬥痕跡暗示著獵殺已經開始，請做好戰鬥準備。
        </div>
        <button id="start-btn">進入結界</button>
    </div>

    <div id="ui-layer">
        <div id="skill-announce">術式順轉「蒼」</div>

        <div id="top-left" class="panel">
            <h1 id="title-text">五條 悟</h1>
            <p>地點: <span class="highlight">東京第一結界</span></p>
            <p>移動: W A S D | 瞄準: 滑鼠移動</p>
            <p>視角: <span style="color:#cc88ff; font-weight:bold;">按住 右鍵 拖曳</span> | 互動: <span style="color:#00ffcc; font-weight:bold;">按 R 修復建築</span></p>
        </div>

        <div id="restore-btn" title="修復場景 (按 R)">🔄</div>
        <div id="gear-btn" title="遊戲設定">⚙️</div>
        <div id="settings-modal" class="panel">
            <label style="font-size: 12px; color:#aaa;">空間透鏡與物理</label>
            <select id="quality">
                <option value="ultra" selected>極致 (折射透鏡 + 光影)</option>
                <option value="high">流暢 (標準光暈)</option>
            </select>
            
            <label style="font-size: 12px; color:#aaa; margin-top:5px;">招式運鏡系統</label>
            <select id="cinematic-toggle">
                <option value="on" selected>開啟 (電影級視角)</option>
                <option value="off">關閉 (固定視角)</option>
            </select>

            <label style="font-size: 12px; color:#aaa; margin-top:5px;">技能冷卻 (CD)</label>
            <select id="cd-toggle">
                <option value="on" selected>開啟 (正常節奏)</option>
                <option value="off">關閉 (無限火力！)</option>
            </select>
        </div>

        <div id="bottom-center">
            <div class="skill-box" id="skill-blue"><div class="cd-overlay" id="cd-over-blue"></div><div class="cd-text" id="cd-txt-blue"></div><div class="skill-key">1</div><span class="skill-name">蒼</span></div>
            <div class="skill-box" id="skill-red"><div class="cd-overlay" id="cd-over-red"></div><div class="cd-text" id="cd-txt-red"></div><div class="skill-key">2</div><span class="skill-name">赫</span></div>
            <div class="skill-box" id="skill-purple"><div class="cd-overlay" id="cd-over-purple"></div><div class="cd-text" id="cd-txt-purple"></div><div class="skill-key">3</div><span class="skill-name">虛式 茈</span></div>
            <div class="skill-box" id="skill-domain"><div class="cd-overlay" id="cd-over-domain"></div><div class="cd-text" id="cd-txt-domain"></div><div class="skill-key">4</div><span class="skill-name">無量<br>空處</span></div>
            <div class="skill-box" id="skill-teleport"><div class="cd-overlay" id="cd-over-teleport"></div><div class="cd-text" id="cd-txt-teleport"></div><div class="skill-key">5</div><span class="skill-name">瞬移</span></div>
            <div class="skill-box" id="skill-melee"><div class="cd-overlay" id="cd-over-melee"></div><div class="cd-text" id="cd-txt-melee"></div><div class="skill-key">Z</div><span class="skill-name">體術</span></div>
        </div>
    </div>

    <script>
        // --- 全域變數宣告 ---
        let gameStarted = false; let isSettingsOpen = false; let isCDEnabled = true;
        let scene, camera, renderer, clock = new THREE.Clock();
        let playerGroup, leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup, limitlessBarrier;
        let projectiles = [], particles = [], physicsDebris = [], shockwaves = [], barrierRipples = [], enemyProjectiles = [];
        let cityElements = [], ground, interactableSurfaces = [];
        let spatialGlitches = [], afterimages = [], impactFlashes = []; let crackDecals = []; 
        let flickeringSigns = [], cursedResiduals = [], streetLights = []; let barrierWall = null, barrierGrid = null;
        
        let dummyGroup, dummyTorso, dummyHead;
        let dummyPhysics = { position: new THREE.Vector3(0, 0, -15), angleX: 0, angleZ: 0, velX: 0, velZ: 0, springK: 12.0, damping: 2.5 };
        let dummyAttackTimer = 3.0; 
        
        let domainState = { active: false, timer: 0, phase: 'none', group: null, infoParticles: null };
        let domainFreeze = false;

        const keys = { w: false, a: false, s: false, d: false };
        const mouse = new THREE.Vector2(); const raycaster = new THREE.Raycaster();
        
        let quality = 'ultra';
        let cameraMode = 3; let cameraDistance = 25; let smoothCameraLookAt = new THREE.Vector3(); 
        let isRightMouseDown = false; let cameraOrbitAngle = 0; let cameraPitchAngle = Math.PI / 4.5; 
        
        let isCinematicEnabled = true; let cinematic = { active: false, timer: 0, duration: 0, type: '' };
        
        let screenShake = 0; let timeScale = 1.0;
        
        let skillCharge = { active: false, type: '', time: 0, maxTime: 0, blueOrb: null, redOrb: null };
        let isAttacking = false; let attackType = 0; let attackTimer = 0;

        const cdMax = { blue: 3.0, red: 5.0, purple: 15.0, domain: 30.0, teleport: 2.0, melee: 0.5 };
        const cooldowns = { blue: 0, red: 0, purple: 0, domain: 0, teleport: 0, melee: 0 };

        // --- UI 事件綁定 ---
        document.getElementById('start-btn').addEventListener('click', function(e) {
            triggerBrittleShatter(this, () => {
                document.getElementById('intro-screen').style.display = 'none';
                gameStarted = true;
                document.getElementById('top-left').style.display = 'block';
                document.getElementById('bottom-center').style.display = 'flex';
                document.getElementById('gear-btn').style.display = 'block';
                document.getElementById('restore-btn').style.display = 'block';
            });
        });

        document.getElementById('gear-btn').addEventListener('click', function() {
            isSettingsOpen = !isSettingsOpen; document.getElementById('settings-modal').style.display = isSettingsOpen ? 'flex' : 'none';
        });

        document.getElementById('cd-toggle').addEventListener('change', (e) => {
            isCDEnabled = (e.target.value === 'on'); if (!isCDEnabled) Object.keys(cooldowns).forEach(key => cooldowns[key] = 0);
        });

        document.getElementById('quality').addEventListener('change', (e) => { 
            quality = e.target.value; renderer.shadowMap.enabled = (quality === 'ultra'); updateLimitlessBarrierMaterial(); 
        });

        document.getElementById('cinematic-toggle').addEventListener('change', (e) => { isCinematicEnabled = (e.target.value === 'on'); });

        document.getElementById('skill-blue').onclick = () => shootProjectile('blue');
        document.getElementById('skill-red').onclick = () => shootProjectile('red');
        document.getElementById('skill-purple').onclick = () => shootProjectile('purple');
        document.getElementById('skill-domain').onclick = () => activateDomain();
        document.getElementById('skill-teleport').onclick = () => teleport();
        document.getElementById('skill-melee').onclick = () => castMelee();
        document.getElementById('restore-btn').addEventListener('click', restoreCity);

        // --- 場景修復功能 ---
        function restoreCity() {
            if (!gameStarted) return;
            announceSkillText("時間回溯 · 場景修復", "#00ffcc");
            createShockwave(playerGroup.position, 0x00ffcc, 200);
            
            cityElements.forEach(el => {
                if (el.userData && (el.userData.isCollapsing || el.userData.isRestoring)) {
                    el.userData.isCollapsing = false;
                    el.userData.isRestoring = true;
                    if(el.userData.roofGroup) el.userData.roofGroup.visible = true;
                }
            });
        }

        // --- 核心系統函式 ---
        function init() {
            const container = document.getElementById('game-container');

            scene = new THREE.Scene(); 
            // 稍顯清澈但仍舊寂靜的夜晚藍黑色
            const fogColor = 0x080a12; 
            scene.background = new THREE.Color(fogColor); 
            // 降低霧氣濃度
            scene.fog = new THREE.FogExp2(fogColor, 0.0025); 

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 環境與主光源
            scene.add(new THREE.AmbientLight(0x4a505a, 1.2));
            const moonLight = new THREE.DirectionalLight(0x7a8bac, 1.5);
            moonLight.position.set(150, 250, 100); moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 2048; moonLight.shadow.mapSize.height = 2048; 
            moonLight.shadow.camera.near = 0.5; moonLight.shadow.camera.far = 600;
            moonLight.shadow.camera.left = -250; moonLight.shadow.camera.right = 250;
            moonLight.shadow.camera.top = 250; moonLight.shadow.camera.bottom = -250;
            scene.add(moonLight);

            buildGridTokyoColony(); createTrainingDummy(); createGojoPlayer();

            window.addEventListener('resize', onWindowResize); 
            document.addEventListener('keydown', onKeyDown); document.addEventListener('keyup', onKeyUp);
            window.addEventListener('mousemove', onMouseMove); window.addEventListener('wheel', onMouseWheel); 
            window.addEventListener('mousedown', (e) => { if (e.button === 2) isRightMouseDown = true; });
            window.addEventListener('mouseup', (e) => { if (e.button === 2) isRightMouseDown = false; });
            window.addEventListener('contextmenu', e => e.preventDefault()); 
        }

        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

        function updateCooldownUI(key, currentCD, maxCD) {
            const box = document.getElementById(`skill-${key}`); const overlay = document.getElementById(`cd-over-${key}`); const txt = document.getElementById(`cd-txt-${key}`);
            if (currentCD > 0) { box.classList.add('on-cd'); overlay.style.height = `${(currentCD / maxCD) * 100}%`; txt.style.display = 'block'; txt.innerText = currentCD.toFixed(1); } 
            else { box.classList.remove('on-cd'); overlay.style.height = `0%`; txt.style.display = 'none'; }
        }

        function announceSkillText(text, color) {
            const el = document.getElementById('skill-announce');
            el.innerText = text; el.style.color = color; el.style.textShadow = `0 0 20px ${color}, 0 0 40px ${color}`;
            el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
            clearTimeout(el.timeoutId); el.timeoutId = setTimeout(() => el.classList.remove('show'), 1500);
        }

        function triggerBrittleShatter(element, callback) {
            const rect = element.getBoundingClientRect(); element.style.visibility = 'hidden'; 
            const colors = ['#aa00ff', '#440088', '#ffffff', '#222'];
            for (let i = 0; i < 35; i++) {
                const shard = document.createElement('div'); shard.className = 'shard';
                shard.style.clipPath = `polygon(${Math.random()*100}% ${Math.random()*100}%, ${Math.random()*100}% ${Math.random()*100}%, ${Math.random()*100}% ${Math.random()*100}%)`;
                const size = 15 + Math.random() * 30; shard.style.width = `${size}px`; shard.style.height = `${size}px`;
                shard.style.left = `${rect.left + Math.random() * rect.width}px`; shard.style.top = `${rect.top + Math.random() * rect.height}px`;
                const color = colors[Math.floor(Math.random() * colors.length)]; shard.style.backgroundColor = color; shard.style.setProperty('--glow-color', color);
                const angle = Math.random() * Math.PI * 2; const velocity = 150 + Math.random() * 300; 
                shard.style.setProperty('--tx', `${Math.cos(angle) * velocity}px`); shard.style.setProperty('--ty', `${Math.sin(angle) * velocity}px`); shard.style.setProperty('--rot', `${(Math.random() - 0.5) * 1000}deg`);
                document.body.appendChild(shard); setTimeout(() => shard.remove(), 800);
            }
            setTimeout(callback, 800);
        }

        function createSignTexture(text, color, bgColor = '#050505') {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor; ctx.fillRect(0, 0, 512, 128);
            ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.strokeRect(5, 5, 502, 118);
            ctx.fillStyle = color; ctx.font = 'bold 70px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);
            const tex = new THREE.CanvasTexture(canvas); tex.needsUpdate = true; return tex;
        }

        function createBuildingTexture(baseColorHex) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColorHex; ctx.fillRect(0, 0, 256, 512);
            for(let y=10; y<512; y+=30) {
                for(let x=10; x<256; x+=20) {
                    if(Math.random() > 0.8) {
                        ctx.fillStyle = (Math.random() > 0.5) ? '#ddf5ff' : '#ffeebb'; 
                    } else {
                        ctx.fillStyle = '#0a0a0c'; 
                    }
                    ctx.fillRect(x, y, 12, 20);
                }
            }
            const tex = new THREE.CanvasTexture(canvas); 
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createGlowTexture(colorHexStr) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            gradient.addColorStop(0, colorHexStr + 'FF'); gradient.addColorStop(0.5, colorHexStr + '66'); gradient.addColorStop(1, colorHexStr + '00');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 256, 256);
            const tex = new THREE.CanvasTexture(canvas); tex.needsUpdate = true; return tex;
        }

        // --- 建立整齊棋盤狀街區 ---
        function buildGridTokyoColony() {
            // 1. 黑紫色巨柱結界 
            const cylinderGeo = new THREE.CylinderGeometry(450, 450, 800, 64, 1, true);
            barrierGrid = new THREE.Mesh(cylinderGeo, new THREE.MeshBasicMaterial({ 
                color: 0x330066, wireframe: true, transparent: true, opacity: 0.15, side: THREE.BackSide, blending: THREE.AdditiveBlending 
            }));
            barrierGrid.position.y = 350; scene.add(barrierGrid);
            barrierWall = new THREE.Mesh(cylinderGeo, new THREE.MeshBasicMaterial({ 
                color: 0x15002a, transparent: true, opacity: 0.4, side: THREE.BackSide, depthWrite: false 
            }));
            barrierWall.position.y = 350; scene.add(barrierWall);

            // 2. 繪製整齊的棋盤狀柏油路
            const groundSize = 1000;
            const gCanvas = document.createElement('canvas'); gCanvas.width = 1024; gCanvas.height = 1024;
            const gCtx = gCanvas.getContext('2d');
            gCtx.fillStyle = '#18191c'; gCtx.fillRect(0, 0, 1024, 1024); 
            
            gCtx.strokeStyle = '#666'; gCtx.lineWidth = 4;
            gCtx.setLineDash([20, 20]);
            for(let i=128; i<1024; i+=256) {
                gCtx.beginPath(); gCtx.moveTo(i, 0); gCtx.lineTo(i, 1024); gCtx.stroke();
                gCtx.beginPath(); gCtx.moveTo(0, i); gCtx.lineTo(1024, i); gCtx.stroke();
            }
            gCtx.setLineDash([]); 

            const groundTex = new THREE.CanvasTexture(gCanvas); 
            groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping; groundTex.repeat.set(6, 6);
            ground = new THREE.Mesh(new THREE.PlaneGeometry(groundSize, groundSize), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.9, metalness: 0.1 }));
            ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
            interactableSurfaces.push(ground);

            // 3. 網格化生成大樓、路燈與車輛
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const neonTexts = ["居酒屋", "ゲーム", "カラオケ", "24h", "パチンコ", "HOTEL", "TOKYO", "薬", "🍜", "VOID"];
            const neonColors = ['#ff0033', '#00ffcc', '#aa00ff', '#ffcc00', '#0088ff'];

                            scene.add(roofGroup); building.userData.roofGroup = roofGroup; cityElements.push(roofGroup);

                        if (isDamaged) {

                            const color = neonColors[Math.floor(Math.random()*neonColors.length)];

                    // 避免著色器錯誤 (MAX_FRAGMENT_UNIFORM_VECTORS)：使用假光源(發光平面)取代耗費效能的 PointLight

        function spawnCrackAndShatter(pos, colorHex, size, isVertical) {
            if (quality === 'low') return;
            const crackGroup = new THREE.Group(); crackGroup.position.copy(pos);
            if (isVertical) { crackGroup.rotation.y = Math.random() * Math.PI; } 
            else { crackGroup.position.y += 0.05; crackGroup.rotation.x = -Math.PI / 2; crackGroup.rotation.z = Math.random() * Math.PI; }

            const material = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 1.0 });
            const points = []; const numCracks = 5 + Math.floor(Math.random() * 5);
            for(let i=0; i<numCracks; i++) {
                let angle = (i / numCracks) * Math.PI * 2 + (Math.random() - 0.5); let r = size * (0.8 + Math.random() * 0.8);
                points.push(new THREE.Vector3(0,0,0));
                let segments = 3; let curX = 0, curY = 0;
                for(let j=1; j<=segments; j++) {
                    curX += Math.cos(angle + (Math.random()-0.5)*1.0) * (r/segments); curY += Math.sin(angle + (Math.random()-0.5)*1.0) * (r/segments);
                    points.push(new THREE.Vector3(curX, curY, 0)); if(j < segments) points.push(new THREE.Vector3(curX, curY, 0));
                }
            }
            crackGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(points), material));
            scene.add(crackGroup); crackDecals.push({ mesh: crackGroup, life: 0.3, colorHex: colorHex, size: size, pos: pos.clone() });
        }

        function checkBuildingHits(impactPos, radius, dir, skillType) {
            for (let i = 0; i < cityElements.length; i++) {
                const el = cityElements[i];
                if (el.userData && el.userData.isSolid && el.visible && !el.userData.isCollapsing) {
                    const dist = el.position.distanceTo(new THREE.Vector3(impactPos.x, el.position.y, impactPos.z));
                    if (dist < radius + Math.max(el.userData.halfW || 5, el.userData.halfD || 5) * 1.2) {
                        el.userData.isCollapsing = true; el.userData.shakeTimer = 0.8; 
                        let debrisColor = 0x222222; 
                        if (skillType === 'blue') debrisColor = 0x0044aa; if (skillType === 'red') debrisColor = 0xaa0033; if (skillType === 'purple') debrisColor = 0x5500aa;

                        spawnCrackAndShatter(impactPos, debrisColor, skillType === 'purple' ? 12 : 5, true);
                        createImpactFlash(impactPos, debrisColor);
                        let collapseFactor = (skillType === 'purple') ? 0.2 : 0.7; 
                        el.userData.targetScaleY = (el.userData.initialScaleY || el.scale.y) * collapseFactor; 
                        el.userData.targetPosY = (el.userData.initialPosY || el.position.y) * collapseFactor;
                        if(el.userData.roofGroup) el.userData.roofGroup.visible = false; 
                        screenShake = Math.max(screenShake, skillType === 'purple' ? 4.0 : 1.8);
                    }
                }
            }
        }

        function castMelee() {
            if (!gameStarted || (isCDEnabled && cooldowns.melee > 0) || attackTimer > 0 || skillCharge.active) return;
            if (isCDEnabled) cooldowns.melee = cdMax.melee;
            
            isAttacking = true; attackType = Math.floor(Math.random() * 3); attackTimer = 0.35; 
            announceSkillText(attackType === 2 ? "破甲踢擊" : "無下限打擊", "#00ffcc"); triggerCinematic('melee', 0.4);
            
            raycaster.setFromCamera(mouse, camera); const intersects = raycaster.intersectObjects(interactableSurfaces);
            if(intersects.length > 0) {
                const startPos = playerGroup.position.clone();
                const target = intersects[0].point; const dir = new THREE.Vector3().subVectors(target, playerGroup.position); dir.y = 0; dir.normalize();
                
                const endPos = startPos.clone().add(dir.clone().multiplyScalar(2.0));
                endPos.x = THREE.MathUtils.clamp(endPos.x, -390, 390); endPos.z = THREE.MathUtils.clamp(endPos.z, -390, 390);
                
                createAfterimage(startPos, playerGroup.rotation.y); createAfterimage(startPos.clone().lerp(endPos, 0.5), playerGroup.rotation.y);
                playerGroup.position.x = endPos.x; playerGroup.position.z = endPos.z;
                const hitPos = new THREE.Vector3(playerGroup.position.x + dir.x * 1.0, playerGroup.position.y + 1.5, playerGroup.position.z + dir.z * 1.0);
                
                createSpatialGlitch(hitPos); createParticles(hitPos, 0x00ffcc, 15, 8); 
                
                if (playerGroup.position.distanceTo(dummyPhysics.position) < 3.5) {
                    dummyPhysics.velX = dir.z * 25; dummyPhysics.velZ = -dir.x * 25; screenShake = 1.5; 
                    spawnCrackAndShatter(hitPos, 0x1a1a20, 1.5, false); createImpactFlash(hitPos, 0x00aaff); createShockwave(hitPos, 0xddffff, 10); 
                } else {
                    spawnCrackAndShatter(hitPos, 0x222222, 2.0, false);
                }
                checkBuildingHits(hitPos, 2.5, dir, 'melee');
            }
        }

        function spawnActualProjectile(type) {

        function createGravitationalRings(parentGroup, size, colorHex) {

        function createShockwave(pos, colorHex, maxScale) {

        function createImplosionParticles(targetPos, radius, colorHex, count) {
            const pGeo = new THREE.BufferGeometry(); const positions = []; const velocities = [];
            for (let i = 0; i < count; i++) {
                const offset = new THREE.Vector3((Math.random() - 0.5) * radius, (Math.random() - 0.5) * radius, (Math.random() - 0.5) * radius);
                const startPos = new THREE.Vector3().addVectors(targetPos, offset); positions.push(startPos.x, startPos.y, startPos.z);
                const vel = new THREE.Vector3().subVectors(targetPos, startPos).multiplyScalar(2.5); velocities.push(vel.x, vel.y, vel.z);
            }
            pGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const particleMesh = new THREE.Points(pGeo, new THREE.PointsMaterial({color: colorHex, size: 1.5, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false}));
            scene.add(particleMesh); particles.push({ mesh: particleMesh, velocities: velocities, life: 0.4 }); 
        }

        function createParticles(pos, colorHex, count, spreadSpeed = 15) {
            const pGeo = new THREE.BufferGeometry(); const positions = []; const velocities = [];
            for (let i = 0; i < count; i++) {
                positions.push(pos.x, pos.y, pos.z); velocities.push((Math.random() - 0.5) * spreadSpeed, (Math.random() - 0.5) * spreadSpeed, (Math.random() - 0.5) * spreadSpeed);
            }
            pGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const particleMesh = new THREE.Points(pGeo, new THREE.PointsMaterial({color: colorHex, size: 1.8, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending, depthWrite: false}));
            scene.add(particleMesh); particles.push({ mesh: particleMesh, velocities: velocities, life: 1.0 });
        }

        function highlightUI(id) { const el = document.getElementById(id); if(el) { el.classList.add('active'); setTimeout(() => el.classList.remove('active'), 250); } }

        function teleport() {

        function activateDomain() {
            if (!gameStarted || domainState.active || (isCDEnabled && cooldowns.domain > 0) || skillCharge.active) return;
            if (isCDEnabled) cooldowns.domain = cdMax.domain;
            
            domainState = { active: true, timer: 0, phase: 'prelude', group: new THREE.Group(), infoParticles: null };
            domainState.group.position.copy(playerGroup.position); scene.add(domainState.group);
            
            document.getElementById('ui-layer').classList.add('domain-ui-mode');
            document.getElementById('title-text').innerText = "領域展開 · 無量空處"; announceSkillText("領域展開「無量空處」", "#aa00ff");
            
            isAttacking = true; attackType = 6; attackTimer = 1.0; triggerCinematic('domain', 8.0); 
            
            cityElements.forEach(b => { if(b.material && b.material.color) b.material.color.setHex(0x000000); });
            scene.fog.color.setHex(0x000000); scene.background.setHex(0x000000);

        function updateDomainSequence(delta, time) {
            domainState.timer += delta; let t = domainState.timer;

            if (t > 0.5 && domainState.phase === 'prelude') {
                domainState.phase = 'burst';
                const overlay = document.getElementById('domain-overlay'); overlay.style.opacity = '1'; setTimeout(() => { overlay.style.opacity = '0'; }, 200);
                screenShake = 3.0;

                const wireMesh1 = new THREE.Mesh(new THREE.IcosahedronGeometry(120, 3), new THREE.MeshBasicMaterial({ color: 0xaa00ff, wireframe: true, transparent: true, opacity: 0.2 }));
                const wireMesh2 = new THREE.Mesh(new THREE.OctahedronGeometry(140, 2), new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.15 }));
                const dome = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 32), new THREE.MeshBasicMaterial({ color: 0x01000a, side: THREE.BackSide }));
                
                domainState.group.add(dome); domainState.group.add(wireMesh1); domainState.group.add(wireMesh2);
                domainState.group.scale.set(0.01, 0.01, 0.01);
                
                domainFreeze = true;
                if (dummyTorso) createParticles(dummyPhysics.position, 0xaa00ff, 40, 5);
            }

            if (t > 1.0 && domainState.phase === 'burst') {
                domainState.phase = 'climax';
                const pGeo = new THREE.BufferGeometry(); const pPos = [];
                for(let i=0; i<800; i++) pPos.push((Math.random()-0.5)*200, (Math.random()-0.5)*200, (Math.random()-0.5)*200);
                pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
                domainState.infoParticles = new THREE.Points(pGeo, new THREE.PointsMaterial({color: 0x00ffff, size: 0.8, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending}));
                domainState.group.add(domainState.infoParticles);
            }

            if (domainState.phase === 'burst' || domainState.phase === 'climax') {
                domainState.group.scale.lerp(new THREE.Vector3(1,1,1), 5 * delta); 
                domainState.group.children.forEach((child, idx) => {
                    if (child.geometry && child.geometry.type !== 'SphereGeometry' && child.type !== 'Points') {
                        child.rotation.x += (idx%2==0?1:-1) * 0.2 * delta; child.rotation.y += 0.3 * delta;
                    }
                });
                
                if (domainState.infoParticles) {
                    const posArr = domainState.infoParticles.geometry.attributes.position.array;
                    for (let i = 0; i < posArr.length; i += 3) { posArr[i+1] -= 20 * delta; if (posArr[i+1] < -100) posArr[i+1] = 100; posArr[i] += Math.sin(time*2 + i)*0.5; }
                    domainState.infoParticles.geometry.attributes.position.needsUpdate = true;
                }
            }

            if (t > 8.0 && domainState.phase === 'climax') {
                domainState.phase = 'fade';
                const overlay = document.getElementById('domain-overlay'); overlay.style.opacity = '0.8'; setTimeout(() => { overlay.style.opacity = '0'; }, 200);
                scene.remove(domainState.group); domainState.active = false; domainFreeze = false;
                scene.background = new THREE.Color(0x080a12); scene.fog.color = new THREE.Color(0x080a12);
                toggleCityVisibility(true);
                document.getElementById('ui-layer').classList.remove('domain-ui-mode'); document.getElementById('title-text').innerText = "五條 悟"; 
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            let rawDelta = clock.getDelta(); if (rawDelta > 0.05) rawDelta = 0.05; 
            
            if (!gameStarted) {
                camera.position.x = Math.sin(clock.getElapsedTime() * 0.1) * 200; camera.position.z = Math.cos(clock.getElapsedTime() * 0.1) * 200; camera.position.y = 80; camera.lookAt(0, 30, 0); renderer.render(scene, camera); return;
            }
            
            if (timeScale < 1.0) { timeScale += rawDelta * 0.5; if (timeScale > 1.0) timeScale = 1.0; }
            const delta = rawDelta * timeScale; const time = clock.getElapsedTime();

            Object.keys(cooldowns).forEach(key => {
                if (cooldowns[key] > 0) { cooldowns[key] -= rawDelta; if (cooldowns[key] <= 0) cooldowns[key] = 0; updateCooldownUI(key, cooldowns[key], cdMax[key]); }
            });

            if (!domainState.active || domainState.timer < 0.5) {
                const speed = 24 * delta; let dx = 0, dz = 0; let inputX = 0, inputZ = 0;
                if (keys.w) inputZ -= 1; if (keys.s) inputZ += 1; if (keys.a) inputX -= 1; if (keys.d) inputX += 1;

                let isOnBuilding = false;

                if ((inputX !== 0 || inputZ !== 0) && !skillCharge.active) {
                    let length = Math.sqrt(inputX * inputX + inputZ * inputZ); inputX /= length; inputZ /= length;
                    let rotatedX = inputX * Math.cos(cameraOrbitAngle) + inputZ * Math.sin(cameraOrbitAngle);
                    let rotatedZ = -inputX * Math.sin(cameraOrbitAngle) + inputZ * Math.cos(cameraOrbitAngle);
                    dx = rotatedX * speed; dz = rotatedZ * speed;

                    let newX = playerGroup.position.x + dx; let newZ = playerGroup.position.z + dz;
                    let pRad = 1.2; let hitX = false, hitZ = false;

                    let dMinX = dummyGroup.position.x - 1.5 - pRad; let dMaxX = dummyGroup.position.x + 1.5 + pRad;
                    let dMinZ = dummyGroup.position.z - 1.5 - pRad; let dMaxZ = dummyGroup.position.z + 1.5 + pRad;
                    if (newX > dMinX && newX < dMaxX && playerGroup.position.z > dMinZ && playerGroup.position.z < dMaxZ && playerGroup.position.y < 5) hitX = true;
                    if (playerGroup.position.x > dMinX && playerGroup.position.x < dMaxX && newZ > dMinZ && newZ < dMaxZ && playerGroup.position.y < 5) hitZ = true;

                    for (let el of cityElements) {
                        if (el.userData && el.userData.isSolid && el.visible && !el.userData.isCollapsing && el.userData.isBuilding) {
                            let hw = el.userData.halfW || 5; let hd = el.userData.halfD || 5;
                            let minX = el.position.x - hw - pRad; let maxX = el.position.x + hw + pRad;
                            let minZ = el.position.z - hd - pRad; let maxZ = el.position.z + hd + pRad;
                            
                            if (playerGroup.userData.targetY >= el.userData.height) {
                                if (playerGroup.position.x > minX && playerGroup.position.x < maxX && playerGroup.position.z > minZ && playerGroup.position.z < maxZ) {
                                    isOnBuilding = true;
                                }
                            } else {
                                if (newX > minX && newX < maxX && playerGroup.position.z > minZ && playerGroup.position.z < maxZ) hitX = true;
                                if (playerGroup.position.x > minX && playerGroup.position.x < maxX && newZ > minZ && newZ < maxZ) hitZ = true;
                            }
                        }
                    }

                    if (!hitX) playerGroup.position.x = newX; if (!hitZ) playerGroup.position.z = newZ;
                    playerGroup.position.x = THREE.MathUtils.clamp(playerGroup.position.x, -390, 390); playerGroup.position.z = THREE.MathUtils.clamp(playerGroup.position.z, -390, 390);
                }

                if (!isOnBuilding && playerGroup.userData.targetY > 0) { playerGroup.userData.targetY = 0; }

                raycaster.setFromCamera(mouse, camera); const intersects = raycaster.intersectObjects(interactableSurfaces); let aimPoint = new THREE.Vector3();
                if(intersects.length > 0) {
                    aimPoint.copy(intersects[0].point);
                    if (!isAttacking) { const targetAngle = Math.atan2(aimPoint.x - playerGroup.position.x, aimPoint.z - playerGroup.position.z); playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, targetAngle, 10 * delta); }
                }
            }

            const baseTargetY = (playerGroup.userData.targetY || 0) + 1.8;
            playerGroup.position.y = THREE.MathUtils.lerp(playerGroup.position.y, baseTargetY + Math.sin(time * 3) * 0.2, 10 * delta);

            if ((keys.w || keys.s || keys.a || keys.d) && Math.random() < 0.25 && !skillCharge.active && playerGroup.position.y < 3) { 
                let ripplePos = playerGroup.position.clone(); ripplePos.y = 0.05; spawnBarrierRipple(ripplePos); 
            }

            if (!domainFreeze && !skillCharge.active) { dummyAttackTimer -= delta; if (dummyAttackTimer <= 0) { dummyShootAttack(); dummyAttackTimer = 3.0; } }

            if(barrierGrid && !domainState.active) { barrierGrid.rotation.y += 0.01 * delta; }
            if(barrierWall && !domainState.active) { barrierWall.rotation.y -= 0.005 * delta; }

            if(!domainState.active) {
                flickeringSigns.forEach(s => {
                    if(Math.random() < s.glitchRate) { s.mesh.material.emissiveIntensity = Math.random() * 0.2; } 
                    else { s.mesh.material.emissiveIntensity = THREE.MathUtils.lerp(s.mesh.material.emissiveIntensity, s.baseIntensity + Math.sin(time*5)*0.2, 10*delta); }
                });
                cursedResiduals.forEach(r => {
                    r.mesh.material.opacity = r.baseOpacity + Math.sin(time * r.speed) * 0.3;
                });
                
                streetLights.forEach(sl => {
                    if (Math.random() < sl.glitchRate) { 
                        sl.bulb.opacity = Math.random() * 0.3; 
                    } else { 
                        sl.bulb.opacity = THREE.MathUtils.lerp(sl.bulb.opacity, sl.baseIntensity + Math.sin(time*3)*0.1, 10*delta); 
                    }
                    sl.pool.opacity = sl.bulb.opacity * 0.6; // 同步假光源(光暈)的亮度
                });
            }

            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                let ep = enemyProjectiles[i];
                if (!domainFreeze) {
                    let distToGojo = ep.mesh.position.distanceTo(new THREE.Vector3(playerGroup.position.x, playerGroup.position.y + 1.0, playerGroup.position.z));
                    if (distToGojo < 3.0) {
                        ep.speed *= Math.pow(0.1, delta * 10); ep.mesh.position.add(new THREE.Vector3((Math.random()-0.5)*0.08, (Math.random()-0.5)*0.08, (Math.random()-0.5)*0.08));
                        if (Math.random() < 0.15 && ep.speed > 0.5) { let hitSurfacePos = ep.mesh.position.clone().sub(playerGroup.position).normalize().multiplyScalar(1.6).add(playerGroup.position); hitSurfacePos.y += 0.8; spawnBarrierRipple(hitSurfacePos); }
                    }
                    ep.mesh.position.addScaledVector(ep.dir, ep.speed * delta); ep.life -= delta;
                }
                if (ep.life <= 0 || ep.speed < 0.05) { createParticles(ep.mesh.position, 0xff1133, 10); scene.remove(ep.mesh); enemyProjectiles.splice(i, 1); }
            }

            for (let i = barrierRipples.length - 1; i >= 0; i--) {
                let r = barrierRipples[i]; r.scale += delta * 3.0; r.life -= delta * 1.5;
                r.mesh.scale.set(r.scale, r.scale, 1); r.mesh.material.opacity = r.life;
                if (r.life <= 0) { scene.remove(r.mesh); barrierRipples.splice(i, 1); }
            }

            cityElements.forEach(el => {
                if (el.userData && el.userData.isCollapsing) {
                    if (el.userData.shakeTimer > 0) {
                        el.userData.shakeTimer -= delta; el.position.x += (Math.random() - 0.5) * 0.4; el.position.z += (Math.random() - 0.5) * 0.4;
                        if (el.userData.shakeTimer <= 0) { el.position.x = el.userData.currentPosX || el.position.x; el.position.z = el.userData.currentPosZ || el.position.z; }
                    }
                    el.scale.y = THREE.MathUtils.lerp(el.scale.y, el.userData.targetScaleY, 6 * delta);
                    el.position.y = THREE.MathUtils.lerp(el.position.y, el.userData.targetPosY, 6 * delta);
                    if(el.userData.hole) { 
                        if(!el.userData.hole.userData) el.userData.hole.userData = {};
                        if(!el.userData.hole.userData.savedY) el.userData.hole.userData.savedY = el.userData.hole.position.y;
                        el.userData.hole.position.y = THREE.MathUtils.lerp(el.userData.hole.position.y, el.userData.targetPosY, 6 * delta); 
                    }
                } else if (el.userData && el.userData.isRestoring) {
                    el.scale.y = THREE.MathUtils.lerp(el.scale.y, el.userData.initialScaleY, 4 * delta);
                    el.position.y = THREE.MathUtils.lerp(el.position.y, el.userData.initialPosY, 4 * delta);
                    if(el.userData.hole && el.userData.hole.userData.savedY) {
                        el.userData.hole.position.y = THREE.MathUtils.lerp(el.userData.hole.position.y, el.userData.hole.userData.savedY, 4 * delta);
                    }
                    if (Math.abs(el.scale.y - el.userData.initialScaleY) < 0.1) {
                        el.scale.y = el.userData.initialScaleY;
                        el.position.y = el.userData.initialPosY;
                        el.userData.isRestoring = false;
                    }
                }
            });

            if (domainState.active) { updateDomainSequence(delta, time); }

            if (dummyTorso) {
                if (domainFreeze) {
                    dummyPhysics.angleX = 0; dummyPhysics.angleZ = 0; dummyTorso.children.forEach(c => { if (c.material) { c.material.transparent = true; c.material.opacity = 0.3; } });
                } else {
                    dummyTorso.children.forEach(c => { if (c.material) { c.material.transparent = false; c.material.opacity = 1.0; } });
                    const forceX = -dummyPhysics.springK * dummyPhysics.angleX - dummyPhysics.damping * dummyPhysics.velX; const forceZ = -dummyPhysics.springK * dummyPhysics.angleZ - dummyPhysics.damping * dummyPhysics.velZ;
                    dummyPhysics.velX += forceX * delta; dummyPhysics.velZ += forceZ * delta; dummyPhysics.angleX += dummyPhysics.velX * delta; dummyPhysics.angleZ += dummyPhysics.velZ * delta;
                    dummyTorso.rotation.x = dummyPhysics.angleX; dummyTorso.rotation.z = dummyPhysics.angleZ;
                }
            }

            for (let i = crackDecals.length - 1; i >= 0; i--) {
                let c = crackDecals[i]; c.life -= delta; c.mesh.scale.setScalar(1 + (0.3 - c.life) * 2);
                if(c.mesh.children[0]) c.mesh.children[0].material.opacity = c.life / 0.3;
                if (c.life <= 0) { scene.remove(c.mesh); spawnPhysicsDebris(c.pos, c.colorHex, Math.floor(c.size * 5)); crackDecals.splice(i, 1); }
            }

            if (!domainFreeze) {
                for (let i = physicsDebris.length - 1; i >= 0; i--) {
                    const deb = physicsDebris[i]; deb.life -= delta; const easeProgress = deb.life / deb.initialLife; deb.velocity.y += deb.gravity * delta;
                    deb.mesh.position.addScaledVector(deb.velocity, delta * Math.max(0.2, easeProgress));
                    if (deb.mesh.position.y < 0.15) { deb.mesh.position.y = 0.15; deb.velocity.y = -deb.velocity.y * 0.45; deb.velocity.x *= 0.55; deb.velocity.z *= 0.55; }
                    deb.mesh.rotation.x += deb.velocity.y * 0.1 * delta; deb.mesh.rotation.y += deb.velocity.x * 0.1 * delta;
                    if (deb.mesh.material) deb.mesh.material.opacity = easeProgress;
                    if (deb.life <= 0) { scene.remove(deb.mesh); physicsDebris.splice(i, 1); }
                }
            }

            if (skillCharge.active) {
                skillCharge.time += delta;
                
                if (skillCharge.type === 'purple') {
                    if(skillCharge.blueOrb && skillCharge.redOrb) {
                        skillCharge.blueOrb.position.y = 1.5 + Math.sin(time * 10) * 0.2; skillCharge.redOrb.position.y = 1.5 + Math.cos(time * 10) * 0.2;
                        skillCharge.blueOrb.children.forEach(child => { if (child.geometry && child.geometry.type === 'TorusGeometry') { child.rotation.x += 10 * delta; child.rotation.y += 10 * delta; } });
                        screenShake = skillCharge.time * 0.8; 
                        if (Math.random() < 0.4) { let bPos = new THREE.Vector3(); skillCharge.blueOrb.getWorldPosition(bPos); createParticles(bPos, 0x00aaff, 2); createImplosionParticles(bPos, 10, 0x00ffff, 3); }
                        if (Math.random() < 0.4) { let rPos = new THREE.Vector3(); skillCharge.redOrb.getWorldPosition(rPos); createParticles(rPos, 0xff0055, 2); createImplosionParticles(rPos, 10, 0xff0000, 3); }

                        if (skillCharge.time > 0.6 && skillCharge.time < 1.2) {
                            skillCharge.blueOrb.position.lerp(new THREE.Vector3(0, 1.5, 1.5), 8 * delta); skillCharge.redOrb.position.lerp(new THREE.Vector3(0, 1.5, 1.5), 8 * delta);
                            createParticles(new THREE.Vector3(0, 1.5, 1.5).applyMatrix4(playerGroup.matrixWorld), 0x010103, 5); 
                        }
                    }
                } else {
                    screenShake = skillCharge.time * 2.0;
                    if (Math.random() < 0.5) createImplosionParticles(playerGroup.position, 15, skillCharge.type === 'blue' ? 0x00aaff : 0xff0055, 4);
                }

                if (skillCharge.time >= skillCharge.maxTime) {
                    toggleCityVisibility(true); 
                    if (skillCharge.type === 'purple') {
                        if(skillCharge.blueOrb) playerGroup.remove(skillCharge.blueOrb); if(skillCharge.redOrb) playerGroup.remove(skillCharge.redOrb);
                        let fusionPos = new THREE.Vector3(0, 1.5, 1.5).applyMatrix4(playerGroup.matrixWorld);
                        createParticles(fusionPos, 0xaa00ff, 100); createParticles(fusionPos, 0x010103, 50);  
                        timeScale = 0.1; screenShake = 3.5; spawnActualProjectile('purple_fire'); 
                    } else { spawnActualProjectile(skillCharge.type); }
                    skillCharge.active = false;
                }
            }

            if (attackTimer > 0) {
                attackTimer -= delta;
                if (attackType === 0) { rightArmGroup.rotation.x = THREE.MathUtils.lerp(rightArmGroup.rotation.x, -Math.PI/1.5, 40*delta); playerGroup.rotation.y += 15*delta; }
                else if (attackType === 1) { leftArmGroup.rotation.x = THREE.MathUtils.lerp(leftArmGroup.rotation.x, -Math.PI/1.5, 40*delta); playerGroup.rotation.y -= 15*delta; }
                else if (attackType === 2) { rightLegGroup.rotation.x = THREE.MathUtils.lerp(rightLegGroup.rotation.x, -Math.PI/1.6, 40*delta); leftArmGroup.rotation.x = THREE.MathUtils.lerp(leftArmGroup.rotation.x, Math.PI/4, 20*delta); }
                else if (attackType === 3) { rightArmGroup.rotation.x = THREE.MathUtils.lerp(rightArmGroup.rotation.x, -Math.PI/2.5, 15*delta); leftArmGroup.rotation.x = THREE.MathUtils.lerp(leftArmGroup.rotation.x, -Math.PI/2.5, 15*delta); }
                else if (attackType === 4) { rightArmGroup.rotation.x = THREE.MathUtils.lerp(rightArmGroup.rotation.x, -Math.PI/2, 30*delta); playerGroup.rotation.y += 5*delta; playerGroup.position.addScaledVector(new THREE.Vector3(Math.sin(playerGroup.rotation.y), 0, Math.cos(playerGroup.rotation.y)), -8*delta); }
                else if (attackType === 5) { rightArmGroup.rotation.x = THREE.MathUtils.lerp(rightArmGroup.rotation.x, -Math.PI/2.5, 15*delta); rightArmGroup.rotation.z = THREE.MathUtils.lerp(rightArmGroup.rotation.z, Math.PI/8, 15*delta); playerGroup.rotation.y += 2*delta; }
                else if (attackType === 6) { rightArmGroup.rotation.x = THREE.MathUtils.lerp(rightArmGroup.rotation.x, -Math.PI/2, 20*delta); rightArmGroup.rotation.z = THREE.MathUtils.lerp(rightArmGroup.rotation.z, Math.PI/4, 20*delta); leftArmGroup.rotation.x = THREE.MathUtils.lerp(leftArmGroup.rotation.x, -Math.PI/2, 20*delta); leftArmGroup.rotation.z = THREE.MathUtils.lerp(leftArmGroup.rotation.z, -Math.PI/4, 20*delta); }
            } else {
                isAttacking = false;
                leftArmGroup.rotation.x = THREE.MathUtils.lerp(leftArmGroup.rotation.x, 0, 10*delta); rightArmGroup.rotation.x = THREE.MathUtils.lerp(rightArmGroup.rotation.x, 0, 10*delta); rightArmGroup.rotation.z = THREE.MathUtils.lerp(rightArmGroup.rotation.z, 0, 10*delta); leftArmGroup.rotation.z = THREE.MathUtils.lerp(leftArmGroup.rotation.z, 0, 10*delta);
                leftLegGroup.rotation.x = THREE.MathUtils.lerp(leftLegGroup.rotation.x, 0, 10*delta); rightLegGroup.rotation.x = THREE.MathUtils.lerp(rightLegGroup.rotation.x, 0, 10*delta);
                if ((keys.w || keys.s || keys.a || keys.d) && (!domainState.active || domainState.timer < 0.5) && !skillCharge.active) {
                    leftLegGroup.rotation.x = Math.sin(time*12)*0.6; rightLegGroup.rotation.x = -Math.sin(time*12)*0.6; leftArmGroup.rotation.x = -Math.sin(time*12)*0.6; rightArmGroup.rotation.x = Math.sin(time*12)*0.6;
                }
            }

            let targetCamPos = new THREE.Vector3(); let targetLookAt = new THREE.Vector3(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z); let camLerpSpeed = 5;

            if (cinematic.active && cinematic.timer > 0) {
                cinematic.timer -= delta; let progress = 1 - (cinematic.timer / cinematic.duration); camLerpSpeed = 8; 
                raycaster.setFromCamera(mouse, camera); const aimPoint = raycaster.intersectObjects(interactableSurfaces)[0]?.point || targetLookAt;
                
                if (cinematic.type === 'melee' || cinematic.type === 'teleport') { targetCamPos.copy(new THREE.Vector3(3, 2, -5).applyMatrix4(playerGroup.matrixWorld)); } 
                else if (cinematic.type === 'blue') { targetCamPos.copy(new THREE.Vector3(4, 3, -8).applyMatrix4(playerGroup.matrixWorld)); targetLookAt.copy(aimPoint); } 
                else if (cinematic.type === 'red') { targetCamPos.copy(new THREE.Vector3(-4, 0.5, -3).applyMatrix4(playerGroup.matrixWorld)); targetLookAt.copy(aimPoint); } 
                else if (cinematic.type === 'purple') { targetCamPos.copy(new THREE.Vector3(0, 4, -cameraDistance*0.8).applyMatrix4(playerGroup.matrixWorld)); targetLookAt.copy(playerGroup.position); targetLookAt.y += 1.5; } 
                else if (cinematic.type === 'purple_fire') { targetCamPos.copy(new THREE.Vector3(2, 3, -10).applyMatrix4(playerGroup.matrixWorld)); targetLookAt.copy(aimPoint); }
                else if (cinematic.type === 'domain') { let angle = progress * Math.PI * 1.5; targetCamPos.set(playerGroup.position.x + Math.cos(angle)*15, playerGroup.position.y + 5 + Math.sin(progress*Math.PI)*5, playerGroup.position.z + Math.sin(angle)*15); }
            } else {
                cinematic.active = false;
                if (cameraMode === 3) {
                    let offsetX = Math.sin(cameraOrbitAngle) * cameraDistance * Math.cos(cameraPitchAngle); let offsetY = Math.sin(cameraPitchAngle) * cameraDistance; let offsetZ = Math.cos(cameraOrbitAngle) * cameraDistance * Math.cos(cameraPitchAngle);
                    targetCamPos.set(playerGroup.position.x + offsetX, playerGroup.position.y + offsetY, playerGroup.position.z + offsetZ); targetLookAt.copy(playerGroup.position); targetLookAt.y += 1.5; camLerpSpeed = 10; 
                } 
                else if (cameraMode === 1) { targetCamPos.set(playerGroup.position.x, playerGroup.position.y + 1.8, playerGroup.position.z); const aimPoint = raycaster.intersectObjects(interactableSurfaces)[0]?.point || new THREE.Vector3(); targetLookAt.copy(new THREE.Vector3().addVectors(targetCamPos, new THREE.Vector3().subVectors(aimPoint, targetCamPos).normalize())); camLerpSpeed = 15; } 
                else if (cameraMode === 2) { targetCamPos.set(playerGroup.position.x, playerGroup.position.y + cameraDistance*1.5, playerGroup.position.z + 10); }
            }

            camera.position.lerp(targetCamPos, camLerpSpeed * delta); smoothCameraLookAt.lerp(targetLookAt, (camLerpSpeed + 2) * delta); camera.lookAt(smoothCameraLookAt);

            if (screenShake > 0) { camera.position.add(new THREE.Vector3((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake)); screenShake *= 0.85; if (screenShake < 0.05) screenShake = 0; }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                let sw = shockwaves[i]; sw.scale += (sw.maxScale - sw.scale)*10*delta; sw.life -= delta*1.5; sw.mesh.scale.set(sw.scale, sw.scale, 1); sw.mesh.material.opacity = sw.life;
                if (sw.life <= 0) { scene.remove(sw.mesh); shockwaves.splice(i, 1); }
            }
            
            for (let i = impactFlashes.length - 1; i >= 0; i--) {
                let f = impactFlashes[i]; f.life -= delta; let progress = f.life / 0.15;
                f.light.intensity = progress * 10; f.meshes.forEach(m => m.material.opacity = progress);
                f.group.scale.setScalar(1 + (1 - progress) * 2);
                if (f.life <= 0) { scene.remove(f.group); impactFlashes.splice(i, 1); }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i]; p.mesh.position.addScaledVector(p.dir, p.speed * delta); p.life -= delta;
                checkBuildingHits(p.mesh.position, p.size, p.dir, p.type);

                if (p.mesh.position.distanceTo(dummyPhysics.position) < (p.size + 1.2) && !domainFreeze) {
                    let pushForce = 35; if (p.type === 'purple') pushForce = 90; if (p.type === 'blue') pushForce = -20;  
                    dummyPhysics.velX = p.dir.z * pushForce; dummyPhysics.velZ = -p.dir.x * pushForce;
                    spawnCrackAndShatter(p.mesh.position, (p.type==='purple'?0xaa00ff:(p.type==='blue'?0x00aaff:0xff0055)), p.type === 'purple' ? 10 : 5, true); p.life = 0;
                }

                if (p.type === 'blue') { p.mesh.children.forEach(c => { if(c.geometry && c.geometry.type==='TorusGeometry') { c.rotation.x+=12*delta; c.rotation.y+=12*delta; }}); screenShake = Math.max(screenShake, 0.2); if(Math.random()<0.6) createImplosionParticles(p.mesh.position, 12, 0x0088ff, 3); }
                if (p.type === 'red') { p.mesh.scale.addScalar(4*delta); screenShake = Math.max(screenShake, 0.4); if(Math.random()<0.7) createParticles(p.mesh.position, 0xff3300, 5, 30); if(Math.random()<0.3) createParticles(p.mesh.position, 0xff0000, 2, 60); }
                if (p.type === 'purple') { p.mesh.scale.addScalar(1.5*delta); p.mesh.rotation.y+=5*delta; p.mesh.rotation.x+=3*delta; screenShake = 0.6; if(Math.random()<0.8) createParticles(p.mesh.position, 0x010103, 8); if(Math.random()<0.5) createParticles(p.mesh.position, p.color, 5); if(Math.random()<0.3) createImplosionParticles(p.mesh.position, 15, 0xaa00ff, 2); }

                if (p.life <= 0) {
                    if (p.type === 'purple') { screenShake = 4.0; createParticles(p.mesh.position, 0x010103, 80); } 
                    else if (p.type === 'red') { screenShake = 1.5; } 
                    else if (p.type === 'blue') { screenShake = 2.0; createImplosionParticles(p.mesh.position, 25, 0x00ffff, 80); }
                    spawnCrackAndShatter(p.mesh.position, p.color, p.type === 'purple' ? 12 : 5, false); scene.remove(p.mesh); projectiles.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let ps = particles[i];
                if (!domainFreeze || ps.mesh === domainState.infoParticles) {
                    const posArr = ps.mesh.geometry.attributes.position.array;
                    for (let j = 0; j < posArr.length; j += 3) { posArr[j]+=ps.velocities[j]*delta; posArr[j+1]+=ps.velocities[j+1]*delta; posArr[j+2]+=ps.velocities[j+2]*delta; }
                    ps.mesh.geometry.attributes.position.needsUpdate = true; ps.life -= delta; ps.mesh.material.opacity = ps.life;
                }
                if (ps.life <= 0 && ps.mesh !== domainState.infoParticles) { scene.remove(ps.mesh); particles.splice(i, 1); }
            }

            for (let i = spatialGlitches.length - 1; i >= 0; i--) {
                let g = spatialGlitches[i]; g.life -= delta; g.mesh.material.opacity = g.life / 0.15; g.mesh.position.x += (Math.random() - 0.5) * 0.1; 
                if (g.life <= 0) { scene.remove(g.mesh); spatialGlitches.splice(i, 1); }
            }
            for (let i = afterimages.length - 1; i >= 0; i--) {
                let ghost = afterimages[i]; ghost.life -= delta; let progress = 1 - (ghost.life / 0.25); 
                ghost.group.scale.set(1 - progress, 1 + progress * 1.5, 1 - progress); 
                ghost.group.children.forEach(c => c.material.opacity = (ghost.life / 0.25) * 0.5);
                if (ghost.life <= 0) { scene.remove(ghost.group); afterimages.splice(i, 1); }
            }

            renderer.render(scene, camera);
        }
        
        init(); animate();
    </script>
</body>
