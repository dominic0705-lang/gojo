<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咒術迴戰：死滅迴游 - 東京第一結界</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #010101;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white; user-select: none;
        }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; transition: opacity 0.5s; }
        .panel {
            background: rgba(5, 2, 10, 0.85); border: 1px solid rgba(170, 50, 255, 0.3);
            border-radius: 8px; padding: 15px; backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(170, 50, 255, 0.1); transition: all 0.5s;
        }
        #top-left { position: absolute; top: 20px; left: 20px; display: none; }
        
        #gear-btn {
            position: absolute; top: 20px; right: 20px; font-size: 28px; cursor: pointer;
            pointer-events: auto; text-shadow: 0 0 10px #aa33ff; display: none;
            transition: transform 0.3s ease;
        }
        #gear-btn:hover { transform: rotate(90deg) scale(1.1); }
        
        #restore-btn {
            position: absolute; top: 20px; right: 65px; font-size: 28px; cursor: pointer;
            pointer-events: auto; text-shadow: 0 0 10px #00ffcc; display: none;
            transition: transform 0.3s ease;
        }
        #restore-btn:hover { transform: rotate(-90deg) scale(1.1); }
        
        #settings-modal {
            position: absolute; top: 60px; right: 20px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 10px; display: none;
            transform-origin: top right; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        #bottom-center { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; display: none; }
        
        h1 { margin: 0 0 5px 0; font-size: 22px; color: #fff; text-shadow: 0 0 15px #aa33ff; letter-spacing: 2px; }
        p { margin: 5px 0; font-size: 14px; color: #aaa; }
        .highlight { color: #cc66ff; font-weight: bold; text-shadow: 0 0 8px #aa33ff; }
        
        #skill-announce {
            position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%) scale(0.5);
            font-size: 45px; font-weight: 900; color: #fff; letter-spacing: 12px;
            opacity: 0; pointer-events: none; z-index: 20;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap; font-style: italic;
        }
        #skill-announce.show { transform: translateX(-50%) scale(1); opacity: 1; }

        .skill-box {
            position: relative; width: 65px; height: 65px; background: rgba(5, 0, 10, 0.7);
            border: 2px solid #324; border-radius: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-size: 13px; font-weight: bold;
            transition: all 0.2s; color: #888; overflow: hidden; pointer-events: auto; cursor: pointer;
        }
        .skill-box.active {
            border-color: #aa55ff; color: #fff; background: rgba(50, 0, 100, 0.8);
            box-shadow: 0 0 25px rgba(170, 80, 255, 0.9); transform: translateY(-10px) scale(1.1);
        }
        .skill-box.on-cd { border-color: #222; color: #444; pointer-events: none; }
        .skill-key { color: #cc88ff; font-size: 14px; margin-bottom: 4px; background: rgba(170, 50, 255, 0.2); padding: 2px 6px; border-radius: 4px; z-index: 2; }
        .skill-name { z-index: 2; text-align: center; }
        
        .cd-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(0, 0, 0, 0.8); z-index: 1; transition: height 0.1s linear; }
        .cd-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: bold; color: #ff3333; z-index: 3; display: none; text-shadow: 0 0 5px #000; }

        select { background: #0a0512; color: #aa55ff; border: 1px solid #aa55ff; padding: 6px; border-radius: 4px; outline: none; cursor: pointer; font-size: 13px; }
        
        #domain-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; opacity: 0; transition: opacity 0.1s; pointer-events: none; z-index: 5; mix-blend-mode: overlay; }

        .domain-ui-mode .panel { background: rgba(0, 5, 20, 0.2); border-color: rgba(170, 0, 255, 0.5); box-shadow: 0 0 30px rgba(170, 0, 255, 0.2); }
        .domain-ui-mode h1 { color: #ddddff; text-shadow: 0 0 15px #aa00ff; letter-spacing: 5px; }

        #intro-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 2, 8, 0.95); z-index: 50; display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(10px);
        }
        .intro-title { font-size: 52px; color: #fff; text-shadow: 0 0 20px #8800ff, 0 0 40px #aa00ff; letter-spacing: 8px; margin-bottom: 20px; text-align: center; }
        .intro-subtitle { font-size: 24px; color: #cc66ff; margin-bottom: 30px; letter-spacing: 4px; }
        .intro-desc { color: #999; font-size: 16px; max-width: 650px; text-align: center; line-height: 1.8; margin-bottom: 30px; border-left: 3px solid #aa00ff; padding-left: 15px; }
        
        .char-select-container { display: flex; gap: 20px; margin-bottom: 40px; }
        .char-card {
            width: 180px; padding: 20px; background: rgba(20, 10, 30, 0.6);
            border: 2px solid #442266; border-radius: 12px; cursor: pointer;
            text-align: center; transition: all 0.3s;
        }
        .char-card:hover { border-color: #aa55ff; background: rgba(40, 20, 60, 0.8); transform: translateY(-5px); }
        .char-card.active { border-color: #00ffcc; background: rgba(10, 40, 40, 0.8); box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); }
        .char-card .char-name { font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 8px; }
        .char-card .char-desc { font-size: 14px; color: #aaa; }
        .char-card.active .char-name { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }

        #start-btn {
            padding: 15px 40px; font-size: 24px; font-weight: bold; color: #000;
            background: #aa33ff; border: none; border-radius: 4px; cursor: pointer;
            box-shadow: 0 0 20px rgba(170, 50, 255, 0.6), inset 0 0 10px rgba(255,255,255,0.4);
            transition: all 0.2s; position: relative;
        }
        #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 35px rgba(170, 50, 255, 1), inset 0 0 15px rgba(255,255,255,0.8); }

        .shard { position: absolute; pointer-events: none; box-shadow: 0 0 15px var(--glow-color), inset 0 0 10px rgba(255,255,255,0.8); animation: shatterAnim 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; z-index: 51; }

        @keyframes shatterAnim { 0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; filter: brightness(2); } 100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.2); opacity: 0; filter: brightness(1); } }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>
    <div id="domain-overlay"></div>

    <div id="intro-screen">
        <div class="intro-title">死滅迴游</div>
        <div class="intro-subtitle">東京第一結界</div>
        <div class="intro-desc">
            結界內的空間已被封鎖，整齊的現代都會化為空無一人的死城。<br>
            十字路口的號誌依舊閃爍，但空氣中瀰漫著詭異的平靜。<br>
            少量戰鬥痕跡暗示著獵殺已經開始，請選擇術師並做好戰鬥準備。
        </div>
        
        <div class="char-select-container">
            <div class="char-card active" id="card-gojo" onclick="selectCharacter('gojo')">
                <div class="char-name">五條 悟</div>
                <div class="char-desc">無下限咒術</div>
            </div>
            <div class="char-card" id="card-yuta" onclick="selectCharacter('yuta')">
                <div class="char-name">乙骨 憂太</div>
                <div class="char-desc">特級咒術師</div>
            </div>
        </div>

        <button id="start-btn">進入結界</button>
    </div>

    <div id="ui-layer">
        <div id="skill-announce">術式順轉「蒼」</div>

        <div id="top-left" class="panel">
            <h1 id="title-text">五條 悟</h1>
            <p>地點: <span class="highlight">東京第一結界</span></p>
            <p>移動: W A S D | 瞄準: 滑鼠移動</p>
            <p>視角: <span style="color:#cc88ff; font-weight:bold;">按住 右鍵 拖曳</span> | 互動: <span style="color:#00ffcc; font-weight:bold;">按 R 修復建築</span></p>
        </div>

        <div id="restore-btn" title="修復場景 (按 R)">🔄</div>
        <div id="gear-btn" title="遊戲設定">⚙️</div>
        <div id="settings-modal" class="panel">
            <label style="font-size: 12px; color:#aaa;">空間透鏡與物理</label>
            <select id="quality">
                <option value="ultra" selected>極致 (折射透鏡 + 光影)</option>
                <option value="high">流暢 (標準光暈)</option>
            </select>
            
            <label style="font-size: 12px; color:#aaa; margin-top:5px;">招式運鏡系統</label>
            <select id="cinematic-toggle">
                <option value="on" selected>開啟 (電影級視角)</option>
                <option value="off">關閉 (固定視角)</option>
            </select>

            <label style="font-size: 12px; color:#aaa; margin-top:5px;">技能冷卻 (CD)</label>
            <select id="cd-toggle">
                <option value="on" selected>開啟 (正常節奏)</option>
                <option value="off">關閉 (無限火力！)</option>
            </select>

            <!-- 新增：咒力覆蓋範圍設定 -->
            <label style="font-size: 12px; color:#aaa; margin-top:5px;">咒力覆蓋部位 (招式 6)</label>
            <select id="coating-area">
                <option value="all" selected>全身 (綜合強化)</option>
                <option value="arms">雙手 (打擊強化)</option>
                <option value="legs">雙腿 (機動強化)</option>
                <option value="weapon">武器 (鋒芒收束)</option>
            </select>
        </div>

        <div id="bottom-center">
            <div class="skill-box" id="skill-blue"><div class="cd-overlay" id="cd-over-blue"></div><div class="cd-text" id="cd-txt-blue"></div><div class="skill-key">1</div><span class="skill-name">蒼</span></div>
            <div class="skill-box" id="skill-red"><div class="cd-overlay" id="cd-over-red"></div><div class="cd-text" id="cd-txt-red"></div><div class="skill-key">2</div><span class="skill-name">赫</span></div>
            <div class="skill-box" id="skill-purple"><div class="cd-overlay" id="cd-over-purple"></div><div class="cd-text" id="cd-txt-purple"></div><div class="skill-key">3</div><span class="skill-name">虛式 茈</span></div>
            <div class="skill-box" id="skill-domain"><div class="cd-overlay" id="cd-over-domain"></div><div class="cd-text" id="cd-txt-domain"></div><div class="skill-key">4</div><span class="skill-name">無量<br>空處</span></div>
            <div class="skill-box" id="skill-teleport"><div class="cd-overlay" id="cd-over-teleport"></div><div class="cd-text" id="cd-txt-teleport"></div><div class="skill-key">5</div><span class="skill-name">瞬移</span></div>
            <!-- 新增：招式六 咒力覆蓋 -->
            <div class="skill-box" id="skill-coating"><div class="cd-overlay" id="cd-over-coating"></div><div class="cd-text" id="cd-txt-coating"></div><div class="skill-key">6</div><span class="skill-name">咒力<br>覆蓋</span></div>
            <div class="skill-box" id="skill-melee"><div class="cd-overlay" id="cd-over-melee"></div><div class="cd-text" id="cd-txt-melee"></div><div class="skill-key">Z</div><span class="skill-name">體術</span></div>
        </div>
    </div>

    <script>
        // --- 全域變數宣告 ---
        let gameStarted = false; let isSettingsOpen = false; let isCDEnabled = true;
        let selectedCharacter = 'gojo'; // 預設選擇五條悟
        
        let scene, camera, renderer, clock = new THREE.Clock();
        let playerGroup, leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup, limitlessBarrier, katanaGroup;
        let projectiles = [], particles = [], physicsDebris = [], shockwaves = [], barrierRipples = [], enemyProjectiles = [];
        let cityElements = [], ground, interactableSurfaces = [];
        let spatialGlitches = [], afterimages = [], impactFlashes = []; let crackDecals = []; 
        let flickeringSigns = [], cursedResiduals = [], streetLights = []; let barrierWall = null, barrierGrid = null;
        let speechRings = []; // 新增：用於管理咒言擴散的音波漣漪
        let spaceShatters = []; // 新增：用於管理天空/空間碎裂的特效陣列
        
        let dummyGroup, dummyTorso, dummyHead;
        let dummyPhysics = { position: new THREE.Vector3(0, 0, -15), angleX: 0, angleZ: 0, velX: 0, velZ: 0, springK: 12.0, damping: 2.5 };
        let dummyAttackTimer = 3.0; 
        
        let domainState = { active: false, timer: 0, phase: 'none', group: null, infoParticles: null };

        const keys = { w: false, a: false, s: false, d: false };
        const mouse = new THREE.Vector2(); const raycaster = new THREE.Raycaster();
        
        let quality = 'ultra';
        let cameraMode = 3; let cameraDistance = 25; let smoothCameraLookAt = new THREE.Vector3(); 
        let isRightMouseDown = false; let cameraOrbitAngle = 0; let cameraPitchAngle = Math.PI / 4.5; 
        
        let isCinematicEnabled = true; let cinematic = { active: false, timer: 0, duration: 0, type: '' };
        
        let screenShake = 0; let timeScale = 1.0;

        let renderTarget, postScene, postCamera, postMaterial;
        let activeDistortions = []; const MAX_DISTORTIONS = 5;

        const MAX_ENERGY_PARTICLES = 1000;
        let instancedEnergy; let energyData = [];
        const MAX_DEBRIS = 500;
        let instancedDebris; let debrisData = [];
        const _dummyMatrix = new THREE.Matrix4();
        const _dummyPosition = new THREE.Vector3();
        const _dummyRotation = new THREE.Euler();
        const _dummyQuaternion = new THREE.Quaternion();
        const _dummyScale = new THREE.Vector3();
        
        let skillCharge = { active: false, type: '', time: 0, maxTime: 0, blueOrb: null, redOrb: null };
        let isAttacking = false; let attackType = 0; let attackTimer = 0;
        
        // 新增連擊系統的變數
        let meleeComboStep = 0; let meleeComboWindow = 0;

        // 新增：招式六的 CD 與狀態變數
        const cdMax = { blue: 3.0, red: 5.0, purple: 15.0, domain: 30.0, teleport: 2.0, melee: 0.5, coating: 15.0 };
        const cooldowns = { blue: 0, red: 0, purple: 0, domain: 0, teleport: 0, melee: 0, coating: 0 };
        let coatingState = { active: false, timer: 0, auras: [] };

        // --- 角色選擇邏輯 ---
        function selectCharacter(charId) {
            selectedCharacter = charId;
            document.getElementById('card-gojo').classList.remove('active');
            document.getElementById('card-yuta').classList.remove('active');
            document.getElementById(`card-${charId}`).classList.add('active');
        }

        // --- UI 事件綁定 ---
        document.getElementById('start-btn').addEventListener('click', function(e) {
            triggerBrittleShatter(this, () => {
                document.getElementById('intro-screen').style.display = 'none';
                gameStarted = true;
                
                updateCharacterUI();
                createPlayer();
                
                document.getElementById('top-left').style.display = 'block';
                document.getElementById('bottom-center').style.display = 'flex';
                document.getElementById('gear-btn').style.display = 'block';
                document.getElementById('restore-btn').style.display = 'block';
            });
        });

        function updateCharacterUI() {
            if (selectedCharacter === 'gojo') {
                document.getElementById('title-text').innerText = "五條 悟";
                document.querySelector('#skill-blue .skill-name').innerHTML = "蒼";
                document.querySelector('#skill-red .skill-name').innerHTML = "赫";
                document.querySelector('#skill-purple .skill-name').innerHTML = "虛式 茈";
                document.querySelector('#skill-domain .skill-name').innerHTML = domainState.active ? "解除<br>領域" : "無量<br>空處";
                document.querySelector('#skill-melee .skill-name').innerHTML = "體術";
                document.querySelector('#skill-coating .skill-name').innerHTML = coatingState.active ? "解除<br>強化" : "咒力<br>強化";
            } else if (selectedCharacter === 'yuta') {
                document.getElementById('title-text').innerText = "乙骨 憂太";
                document.querySelector('#skill-blue .skill-name').innerHTML = "宇守<br>羅彈";
                document.querySelector('#skill-red .skill-name').innerHTML = "咒言";
                document.querySelector('#skill-purple .skill-name').innerHTML = "反轉<br>術式";
                // --- 更新：解鎖乙骨的領域展開 ---
                document.querySelector('#skill-domain .skill-name').innerHTML = domainState.active ? "解除<br>領域" : "真贗<br>相愛";
                document.querySelector('#skill-melee .skill-name').innerHTML = "斬擊";
                document.querySelector('#skill-coating .skill-name').innerHTML = coatingState.active ? "解除<br>覆蓋" : "咒力<br>覆蓋";
            }
        }

        document.getElementById('gear-btn').addEventListener('click', function() {
            isSettingsOpen = !isSettingsOpen; document.getElementById('settings-modal').style.display = isSettingsOpen ? 'flex' : 'none';
        });

        document.getElementById('cd-toggle').addEventListener('change', (e) => {
            isCDEnabled = (e.target.value === 'on'); if (!isCDEnabled) Object.keys(cooldowns).forEach(key => cooldowns[key] = 0);
        });

        document.getElementById('quality').addEventListener('change', (e) => { 
            quality = e.target.value; renderer.shadowMap.enabled = (quality === 'ultra'); updateLimitlessBarrierMaterial(); 
        });

        document.getElementById('cinematic-toggle').addEventListener('change', (e) => { isCinematicEnabled = (e.target.value === 'on'); });

        document.getElementById('skill-blue').onclick = () => shootProjectile('blue');
        document.getElementById('skill-red').onclick = () => shootProjectile('red');
        document.getElementById('skill-purple').onclick = () => shootProjectile('purple');
        document.getElementById('skill-domain').onclick = () => activateDomain();
        document.getElementById('skill-teleport').onclick = () => teleport();
        document.getElementById('skill-coating').onclick = () => activateCoating(); // 招式六綁定
        document.getElementById('skill-melee').onclick = () => castMelee();
        document.getElementById('restore-btn').addEventListener('click', restoreCity);

        // --- 場景修復功能 ---
        function restoreCity() {
            if (!gameStarted) return;
            announceSkillText("時間回溯 · 場景修復", "#00ffcc");
            createShockwave(playerGroup.position, 0x00ffcc, 200);
            
            cityElements.forEach(el => {
                if (el.userData && (el.userData.isCollapsing || el.userData.isRestoring)) {
                    el.userData.isCollapsing = false;
                    el.userData.isRestoring = true;
                    if(el.userData.roofGroup) el.userData.roofGroup.visible = true;
                }
            });
        }

        // --- 核心系統函式 ---
        function init() {
            const container = document.getElementById('game-container');

            scene = new THREE.Scene(); 
            const fogColor = 0x080a12; 
            scene.background = new THREE.Color(fogColor); 
            scene.fog = new THREE.FogExp2(fogColor, 0.0025); 

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x4a505a, 1.2));
            const moonLight = new THREE.DirectionalLight(0x7a8bac, 1.5);
            moonLight.position.set(150, 250, 100); moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 2048; moonLight.shadow.mapSize.height = 2048; 
            moonLight.shadow.camera.near = 0.5; moonLight.shadow.camera.far = 600;
            moonLight.shadow.camera.left = -250; moonLight.shadow.camera.right = 250;
            moonLight.shadow.camera.top = 250; moonLight.shadow.camera.bottom = -250;
            scene.add(moonLight);

            const energyGeo = new THREE.DodecahedronGeometry(0.15);
            const energyMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            instancedEnergy = new THREE.InstancedMesh(energyGeo, energyMat, MAX_ENERGY_PARTICLES);
            instancedEnergy.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            for(let i=0; i<MAX_ENERGY_PARTICLES; i++) { energyData.push({ active: false, life: 0 }); _dummyMatrix.makeScale(0,0,0); instancedEnergy.setMatrixAt(i, _dummyMatrix); }
            scene.add(instancedEnergy);

            const debrisGeo = new THREE.DodecahedronGeometry(0.4);
            const debrisMat = new THREE.MeshPhysicalMaterial({ color: 0x222222, roughness: 0.8, metalness: 0.2 });
            instancedDebris = new THREE.InstancedMesh(debrisGeo, debrisMat, MAX_DEBRIS);
            instancedDebris.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            for(let i=0; i<MAX_DEBRIS; i++) { debrisData.push({ active: false, life: 0 }); _dummyMatrix.makeScale(0,0,0); instancedDebris.setMatrixAt(i, _dummyMatrix); }
            scene.add(instancedDebris);

            const dpr = Math.min(window.devicePixelRatio, 2);
            renderTarget = new THREE.WebGLRenderTarget(window.innerWidth * dpr, window.innerHeight * dpr);
            postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            postScene = new THREE.Scene();
            postMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    tDiffuse: { value: renderTarget.texture },
                    u_time: { value: 0 },
                    u_resolution: { value: new THREE.Vector2(window.innerWidth * dpr, window.innerHeight * dpr) },
                    u_distortionCount: { value: 0 },
                    u_distortData: { value: Array(MAX_DISTORTIONS).fill(new THREE.Vector4(0,0,0,0)) }
                },
                vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                fragmentShader: `
                    uniform sampler2D tDiffuse; uniform float u_time; uniform vec2 u_resolution;
                    uniform int u_distortionCount; uniform vec4 u_distortData[5];
                    varying vec2 vUv;
                    void main() {
                        vec2 uv = vUv; vec2 distort = vec2(0.0); float aspect = u_resolution.x / u_resolution.y;
                        float totalStrength = 0.0;
                        for(int i = 0; i < 5; i++) {
                            if (i >= u_distortionCount) break;
                            vec2 center = u_distortData[i].xy; float radius = u_distortData[i].z; float strength = u_distortData[i].w;
                            vec2 dir = uv - center; dir.x *= aspect; float dist = length(dir);
                            if (dist < radius) {
                                float falloff = pow(max(0.0, 1.0 - dist/radius), 2.0);
                                float noise = sin(dist * 50.0 - u_time * 20.0) * 0.08; 
                                distort += normalize(dir) * strength * falloff * (1.0 + noise);
                                totalStrength += abs(strength * falloff);
                            }
                        }
                        
                        // 加入色差分離 (Chromatic Aberration) 模擬高壓環境與鏡頭失真
                        float caStrength = totalStrength * 0.06;
                        vec2 uvR = uv + distort * (1.0 + caStrength);
                        vec2 uvG = uv + distort;
                        vec2 uvB = uv + distort * (1.0 - caStrength);
                        
                        float r = texture2D(tDiffuse, uvR).r;
                        float g = texture2D(tDiffuse, uvG).g;
                        float b = texture2D(tDiffuse, uvB).b;
                        
                        gl_FragColor = vec4(r, g, b, 1.0);
                    }
                `
            });
            const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial);

                points.push(new THREE.Vector3(0,0,0));
                let segments = 3; let curX = 0, curY = 0;
                for(let j=1; j<=segments; j++) {
                    curX += Math.cos(angle + (Math.random()-0.5)*1.0) * (r/segments); curY += Math.sin(angle + (Math.random()-0.5)*1.0) * (r/segments);
                    points.push(new THREE.Vector3(curX, curY, 0)); if(j < segments) points.push(new THREE.Vector3(curX, curY, 0));
                }
            }
            crackGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(points), material));

        // --- 新增：專屬「宇守羅彈」的空間碎裂 (玻璃裂痕) 視覺特效 ---
        function spawnSpaceShatter(pos, size) {
            const group = new THREE.Group();
            group.position.copy(pos);
            // 讓裂痕永遠面向鏡頭，製造出宛如螢幕/空間表面被打破的 2D 魄力感
            group.lookAt(camera.position);

            const glowMat = new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 1.0 });
            const coreMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1.0 });
            
            const points = [];
            // 產生隨機放射狀的閃電/玻璃裂痕
            const numBranches = 8 + Math.floor(Math.random() * 5);
            for (let i = 0; i < numBranches; i++) {
                let angle = (i / numBranches) * Math.PI * 2 + (Math.random() - 0.5) * 1.0;
                let curPos = new THREE.Vector3(0, 0, 0);
                let branchPoints = [curPos.clone()];
                
                let length = size * (0.6 + Math.random() * 0.6);
                let segments = 4 + Math.floor(Math.random() * 3);
                
                for (let j = 0; j < segments; j++) {
                    let stepLength = length / segments;
                    angle += (Math.random() - 0.5) * 1.5; // 銳利不規則的轉折
                    curPos.x += Math.cos(angle) * stepLength;
                    curPos.y += Math.sin(angle) * stepLength;
                    branchPoints.push(curPos.clone());
                }
                
                // 轉換為 LineSegments 所需的 A-B, B-C 格式
                for(let k=0; k<branchPoints.length-1; k++) {
                    points.push(branchPoints[k], branchPoints[k+1]);
                }
                
                // 隨機產生分支細紋
                if (Math.random() > 0.3) {
                    let subStart = branchPoints[Math.floor(branchPoints.length / 2)];
                    let subAngle = angle + (Math.random() > 0.5 ? 1 : -1) * (0.5 + Math.random());
                    let subPos = subStart.clone();
                    let subLength = length * 0.5;
                    for(let j=0; j<3; j++) {
                        let subStep = subLength / 3;
                        subAngle += (Math.random() - 0.5) * 1.0;
                        let nextPos = subPos.clone().add(new THREE.Vector3(Math.cos(subAngle)*subStep, Math.sin(subAngle)*subStep, 0));
                        points.push(subPos, nextPos);
                        subPos = nextPos;
                    }
                }
            }
            
            const lineGeom = new THREE.BufferGeometry().setFromPoints(points);
            const glowLine = new THREE.LineSegments(lineGeom, glowMat);
            const coreLine = new THREE.LineSegments(lineGeom, coreMat);
            glowLine.scale.setScalar(1.05); // 讓外暈稍大
            glowLine.position.z = -0.1;
            
            group.add(glowLine);
            group.add(coreLine);
            
            // 裂痕深處的純黑色虛無空間碎片
            const darkMat = new THREE.MeshBasicMaterial({color: 0x020005, side: THREE.DoubleSide, transparent: true, opacity: 0.9});
            for(let i=0; i<6; i++) {
                const shardGeom = new THREE.CircleGeometry(size * (0.15 + Math.random()*0.2), 3); // 不規則三角形
                const shard = new THREE.Mesh(shardGeom, darkMat);
                shard.position.set((Math.random()-0.5)*size*0.5, (Math.random()-0.5)*size*0.5, -0.2);
                shard.rotation.z = Math.random() * Math.PI * 2;
                shard.scale.set(1, 0.2 + Math.random()*0.8, 1);
                group.add(shard);
            }

            scene.add(group);
            spaceShatters.push({ group: group, life: 0.8, maxLife: 0.8, meshes: [glowLine, coreLine, ...group.children] });
            
            // 噴發清澈如玻璃般的碎屑
            spawnPhysicsDebris(pos, 0xaaddff, 30);
            createImpactFlash(pos, 0x88ccff);
        }

        function spawnPhysicsDebris(pos, colorHex, count = 15) {
            if (quality === 'low') return; if (quality === 'high') count = Math.max(3, Math.floor(count / 3));

                    debrisData[i].rot = new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                    debrisData[i].color = new THREE.Color(colorHex);
                    instancedDebris.setColorAt(i, debrisData[i].color);

        // --- 新增：黑紫色的彗星尾跡與狂暴風道 ---
        function createCometTrail(startPos, endPos, dir) {
            const distance = startPos.distanceTo(endPos);
            const midPoint = startPos.clone().lerp(endPos, 0.5);
            midPoint.y += 1.2;

            const trailGroup = new THREE.Group();
            trailGroup.position.copy(midPoint);
            trailGroup.lookAt(endPos.clone().setY(midPoint.y));

            // 核心：高密度黑紫光芒
            const coreGeo = new THREE.CylinderGeometry(0.5, 0.1, distance, 12, 1, true);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x050011, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.rotation.x = Math.PI / 2;
            trailGroup.add(core);

            // 外層：激盪的紫色咒力殘光
            const auraGeo = new THREE.CylinderGeometry(1.5, 0.3, distance, 12, 1, true);
            const auraMat = new THREE.MeshBasicMaterial({ color: 0xaa00ff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
            const aura = new THREE.Mesh(auraGeo, auraMat);
            aura.rotation.x = Math.PI / 2;
            trailGroup.add(aura);

            scene.add(trailGroup);
            
            // 借用 impactFlashes 淡出尾跡
            const dummyLight = new THREE.PointLight(0x000000, 0, 0);
            impactFlashes.push({ group: trailGroup, light: dummyLight, meshes: [core, aura], life: 0.3 });

            // 捲入沿途的粉塵與碎玻璃地毯
            for(let i=0; i<15; i++) {
                const pPos = startPos.clone().lerp(endPos, Math.random());
                pPos.y += Math.random() * 2;
                createParticles(pPos, 0x888888, 3, 10);
            }
        }

        function dash() {
            if (!gameStarted || skillCharge.active) return;
            const isYuta = selectedCharacter === 'yuta';
            // 乙骨的爆發力能帶來更長、更暴力的衝刺距離
            const dashDistance = isYuta ? 22.0 : 14.0; 
            
            // 根據玩家目前面向的角度決定衝刺方向
            const dir = new THREE.Vector3(Math.sin(playerGroup.rotation.y), 0, Math.cos(playerGroup.rotation.y)).normalize();
            
            const startPos = playerGroup.position.clone();
            const endPos = startPos.clone().add(dir.multiplyScalar(dashDistance));
            endPos.x = THREE.MathUtils.clamp(endPos.x, -390, 390);
            endPos.z = THREE.MathUtils.clamp(endPos.z, -390, 390);

            if (isYuta) {
                // --- 乙骨憂太：極致肉體爆發的直線彈射 ---
                
                // 1. 動態起手式：強行壓低重心，身體近乎平行地面
                playerGroup.rotation.x = Math.PI / 3.5; 
                playerGroup.position.y = (playerGroup.userData.targetY || 0) + 0.5; // 重心急劇下沉
                leftLegGroup.rotation.x = -Math.PI / 3;
                rightLegGroup.rotation.x = -Math.PI / 3;
                if (katanaGroup) katanaGroup.rotation.x = Math.PI / 2; // 死死扣住刀柄

                // 2. 起點炸裂：軍靴蹬碎地面的恐怖反作用力
                spawnCrackAndShatter(startPos, 0x1a1a20, 6, false);
                spawnPhysicsDebris(startPos, 0x222222, 25);
                createImpactFlash(startPos, 0x5500aa);

                // 3. 突破音障的白色圓環衝擊波
                createSonicBoom(startPos, dir);

                // 4. 被拉扯得極長的黑紫色彗星尾跡與狂暴風道
                createCometTrail(startPos, endPos, dir);

                // 5. 終點急停與焦油白煙 (摩擦深溝)
                setTimeout(() => {
                    spawnCrackAndShatter(endPos, 0x050505, 5, false); // 犁出焦黑深溝
                    createEvaporationParticles(endPos.clone().setY(0.2), 0x999999, 20); // 摩擦的高溫白煙
                }, 50);

                // 6. 空間塌陷與窒息感壓迫
                addDistortion(endPos, 0.5, 2.5, 0.4); 
                screenShake = 4.5; // 破壞性的鏡頭震動

                // 高密度的殘影
                createAfterimage(startPos, playerGroup.rotation.y);
                createAfterimage(startPos.clone().lerp(endPos, 0.25), playerGroup.rotation.y);
                createAfterimage(startPos.clone().lerp(endPos, 0.5), playerGroup.rotation.y);
                createAfterimage(startPos.clone().lerp(endPos, 0.75), playerGroup.rotation.y);

                triggerCinematic('teleport', 0.2);
            } else {

        function checkBuildingHits(impactPos, radius, dir, skillType) {
            for (let i = 0; i < cityElements.length; i++) {
                const el = cityElements[i];
                if (el.userData && el.userData.isSolid && el.visible && !el.userData.isCollapsing) {
                    const dist = el.position.distanceTo(new THREE.Vector3(impactPos.x, el.position.y, impactPos.z));
                    if (dist < radius + Math.max(el.userData.halfW || 5, el.userData.halfD || 5) * 1.2) {
                        el.userData.isCollapsing = true; el.userData.shakeTimer = 0.8; 
                        let debrisColor = 0x222222;

                        if (skillType === 'slash') debrisColor = 0xffffff; 

                        spawnCrackAndShatter(impactPos, debrisColor, (skillType === 'purple' || skillType === 'slash') ? 12 : 5, true);
                        createImpactFlash(impactPos, debrisColor);
                        let collapseFactor = (skillType === 'purple') ? 0.2 : 0.7; 
                        el.userData.targetScaleY = (el.userData.initialScaleY || el.scale.y) * collapseFactor; 
                        el.userData.targetPosY = (el.userData.initialPosY || el.position.y) * collapseFactor;

                    }

        }

        function spawnActualProjectile(type) {

                    }, i * 80); // 更密集的音波發射間隔

        // --- 新增：反轉術式極限爆發特效 ---
        function spawnRCTExplosion(pos) {
            const group = new THREE.Group();
            group.position.copy(pos);

            // 核心：純白無瑕、液態般高密度的光芒

            const glow = new THREE.Mesh(new THREE.SphereGeometry(3.5, 32, 32), glowMat);
            group.add(glow);

            scene.add(group);

            createImpactFlash(pos, 0xffffff);

            // 極致的定格與螢幕震動，表現能量灌注的沉重感

            impactFlashes.push({ group: group, light: dummyLight, meshes: [core, glow], life: 0.7 });
        }

        // --- 新增：咒力火焰著色器 (Flame Shader) ---
        function getFlameShaderMaterial(colorHex) {
            return new THREE.ShaderMaterial({
                uniforms: {
                    u_time: { value: 0.0 },
                    u_color: { value: new THREE.Color(colorHex) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    varying vec3 vViewPosition;
                    uniform float u_time;
                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        // 強化火焰向上拉伸與波動的感覺
                        float noise = sin(pos.y * 10.0 + u_time * 15.0) * cos(pos.x * 10.0 + u_time * 10.0) * 0.08;
                        // 頂部形變更大，模擬不穩定的火舌
                        pos.x += normal.x * noise * (pos.y + 1.0);
                        pos.z += normal.z * noise * (pos.y + 1.0);
                        pos.y += abs(noise) * 0.5;
                        
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        vViewPosition = -mvPosition.xyz;
                        vNormal = normalMatrix * normal;
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform float u_time;
                    uniform vec3 u_color;
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    varying vec3 vViewPosition;

                    void main() {
                        // UV 動態流動 (模擬火焰向上飄移)
                        vec2 waveUv = vUv;
                        waveUv.y -= u_time * 3.0; // 加快火焰流動速度
                        waveUv.x += sin(waveUv.y * 8.0 + u_time * 2.0) * 0.08; // 更明顯的左右搖曳
                        
                        // 產生疊加的三角函數雜訊，模擬火焰的撕裂與層次感
                        float fire1 = sin(waveUv.x * 20.0) * sin(waveUv.y * 10.0);
                        fire1 = pow(abs(fire1), 0.6); // 降低次方讓火焰更飽滿
                        
                        float fire2 = sin(waveUv.x * 35.0 - u_time * 6.0) * cos(waveUv.y * 25.0 + u_time * 4.0);
                        fire2 = abs(fire2);
                        
                        float combinedFire = (fire1 + fire2) * 0.5;

                        // 邊緣發光 (Fresnel 效果)，讓咒力像是一層膜包覆在身體外
                        vec3 normal = normalize(vNormal);
                        vec3 viewDir = normalize(vViewPosition);
                        float rim = 1.0 - max(dot(viewDir, normal), 0.0);
                        rim = smoothstep(0.4, 1.0, rim); // 強化邊緣對比
                        
                        // 核心高光
                        float core = pow(combinedFire, 1.5);
                        
                        // 頂部漸隱，避免幾何體頂端出現生硬的切邊
                        float topFade = smoothstep(1.0, 0.4, vUv.y);
                        
                        // 結合透明度與顏色，強化核心亮度與邊緣的對比
                        float finalAlpha = clamp((core * 1.5 + rim) * topFade, 0.0, 1.0);
                        // 核心混入白色，表現高溫與高密度能量
                        vec3 finalColor = mix(u_color, vec3(1.0), core * 0.6); 
                        
                        gl_FragColor = vec4(finalColor, finalAlpha);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending, // 疊加混合產生強光
                depthWrite: false,
                side: THREE.DoubleSide
            });
        }

        function activateCoating() {

                const auraMat = getFlameShaderMaterial(colorHex);

            if (area === 'all' || area === 'legs') {
                addAura(leftLegGroup, legGeo, -0.5); addAura(rightLegGroup, legGeo, -0.5);

            // 變更UI按鈕顯示為可解除
            document.querySelector('#skill-coating .skill-name').innerHTML = selectedCharacter === 'gojo' ? "解除<br>強化" : "解除<br>覆蓋";

            let skillName = selectedCharacter === 'gojo' ? "咒力強化" : "咒力解放";
            let textMapping = { 'all': '全身', 'arms': '手部', 'legs': '腳部', 'weapon': '武器' };
            announceSkillText(`${skillName} · ${textMapping[area]}`, colorHex === 0x00ffff ? "#00ffff" : "#ff11aa");
            
            createShockwave(playerGroup.position, colorHex, 20);

        function updateDomainSequence(delta, time) {
            domainState.timer += delta; let t = domainState.timer;

            if (selectedCharacter === 'gojo') {
                // --- 五條悟：無量空處 ---
                if (t > 0.5 && domainState.phase === 'prelude') {
                    domainState.phase = 'burst';
                    const overlay = document.getElementById('domain-overlay'); overlay.style.opacity = '1'; setTimeout(() => { overlay.style.opacity = '0'; }, 200);
                    screenShake = 3.0;

                    const wireMesh1 = new THREE.Mesh(new THREE.IcosahedronGeometry(120, 3), new THREE.MeshBasicMaterial({ color: 0xaa00ff, wireframe: true, transparent: true, opacity: 0.2 }));
                    const wireMesh2 = new THREE.Mesh(new THREE.OctahedronGeometry(140, 2), new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.15 }));
                    const dome = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 32), new THREE.MeshBasicMaterial({ color: 0x01000a, side: THREE.BackSide }));
                    
                    domainState.group.add(dome); domainState.group.add(wireMesh1); domainState.group.add(wireMesh2);
                    domainState.group.scale.set(0.01, 0.01, 0.01);
                    
                    if (dummyTorso) createParticles(dummyPhysics.position, 0xaa00ff, 40, 5);
                }

                if (t > 1.0 && domainState.phase === 'burst') {
                    domainState.phase = 'climax';

                    const pGeo = new THREE.BufferGeometry(); const pPos = [];
                    for(let i=0; i<800; i++) pPos.push((Math.random()-0.5)*200, (Math.random()-0.5)*200, (Math.random()-0.5)*200);
                    pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
                    domainState.infoParticles = new THREE.Points(pGeo, new THREE.PointsMaterial({color: 0x00ffff, size: 0.8, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending}));
                    domainState.group.add(domainState.infoParticles);

                    p.life = 0;
                }

                if (p.type === 'blue') { p.mesh.children.forEach(c => { if(c.geometry && c.geometry.type==='TorusGeometry') { c.rotation.x+=12*delta; c.rotation.y+=12*delta; }}); screenShake = Math.max(screenShake, 0.2); if(Math.random()<0.6) createImplosionParticles(p.mesh.position, 12, 0x0088ff, 3); }
                if (p.type === 'red') { p.mesh.scale.addScalar(4*delta); screenShake = Math.max(screenShake, 0.4); if(Math.random()<0.7) createParticles(p.mesh.position, 0xff3300, 5, 30); if(Math.random()<0.3) createParticles(p.mesh.position, 0xff0000, 2, 60); }
                if (p.type === 'purple') { p.mesh.scale.addScalar(1.5*delta); p.mesh.rotation.y+=5*delta; p.mesh.rotation.x+=3*delta; screenShake = 0.6; if(Math.random()<0.8) createParticles(p.mesh.position, 0x010103, 8); if(Math.random()<0.5) createParticles(p.mesh.position, p.color, 5); if(Math.random()<0.3) createImplosionParticles(p.mesh.position, 15, 0xaa00ff, 2); }
                if (p.type === 'space_rend') { 
                    p.mesh.scale.addScalar(8*delta); 
                    addDistortion(p.mesh.position, 0.2, p.mesh.scale.x * 0.8, 0.1); 
                    if(Math.random()<0.5) createSpatialGlitch(p.mesh.position); 
                }

                if (p.life <= 0) {
                    if (p.type === 'purple') { screenShake = 4.0; createParticles(p.mesh.position, 0x010103, 80); triggerHitStop(80); createBlackFlash(p.mesh.position, 12); spawnCrackAndShatter(p.mesh.position, p.color, 12, false); } 
                    else if (p.type === 'red') { screenShake = 1.5; spawnCrackAndShatter(p.mesh.position, p.color, 5, false); } 
                    else if (p.type === 'blue') { screenShake = 2.0; createImplosionParticles(p.mesh.position, 25, 0x00ffff, 80); spawnCrackAndShatter(p.mesh.position, p.color, 5, false); }
                    else if (p.type === 'space_rend') { 
                        // 完全獨立判定：壽命結束炸開時，同樣觸發專屬的天空碎裂
                        screenShake = 3.5; createShockwave(p.mesh.position, 0xffffff, 40); addDistortion(p.mesh.position, 0.6, 1.5, 0.5); triggerHitStop(40);
                        spawnSpaceShatter(p.mesh.position, 12); 
                    }
                    scene.remove(p.mesh); projectiles.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let ps = particles[i];
                {
                    const posArr = ps.mesh.geometry.attributes.position.array;
                    for (let j = 0; j < posArr.length; j += 3) { posArr[j]+=ps.velocities[j]*delta; posArr[j+1]+=ps.velocities[j+1]*delta; posArr[j+2]+=ps.velocities[j+2]*delta; }
                    ps.mesh.geometry.attributes.position.needsUpdate = true; ps.life -= delta; ps.mesh.material.opacity = ps.life;
                }
                if (ps.life <= 0 && ps.mesh !== domainState.infoParticles) { scene.remove(ps.mesh); particles.splice(i, 1); }
            }

            // --- 優化：處理咒言實體音波漣漪的擴散 ---
            for (let i = speechRings.length - 1; i >= 0; i--) {
                let r = speechRings[i]; r.scale += delta * 45; r.life -= delta; // 加快音波擴散速度 (30 -> 45)
                r.mesh.scale.set(r.scale, r.scale, r.scale);
                // 調整漸隱邏輯，讓音波消散得更自然
                r.mesh.children.forEach(c => { c.material.opacity = (r.life / 0.6) * 0.8; });
                if (r.life <= 0) { scene.remove(r.mesh); speechRings.splice(i, 1); }
            }

            for (let i = spatialGlitches.length - 1; i >= 0; i--) {
                let g = spatialGlitches[i]; g.life -= delta; g.mesh.material.opacity = g.life / 0.15; g.mesh.position.x += (Math.random() - 0.5) * 0.1; 
                if (g.life <= 0) { scene.remove(g.mesh); spatialGlitches.splice(i, 1); }
            }
            
            // --- 新增：處理空間碎裂 (Space Shatter) 的漸隱與動畫 ---
            for (let i = spaceShatters.length - 1; i >= 0; i--) {
                let s = spaceShatters[i];
                s.life -= delta;
                let progress = s.life / s.maxLife;
                
                // 裂痕會極度輕微地擴張，模擬空間繃斷後的鬆弛
                s.group.scale.setScalar(1 + (1 - progress) * 0.1); 
                
                s.meshes.forEach(m => {
                    if (m.material) {
                        // 讓中心的黑洞碎片保持一定的透明度，發光線條則漸漸消散
                        m.material.opacity = progress * (m.material.color.getHex() === 0x020005 ? 0.9 : 1.0); 
                    }
                });

                if (s.life <= 0) {
                    scene.remove(s.group);
                    spaceShatters.splice(i, 1);
                }
            }

            for (let i = afterimages.length - 1; i >= 0; i--) {
                let ghost = afterimages[i]; ghost.life -= delta; 
                let progress = 1 - (ghost.life / (ghost.isYutaSlash ? 0.3 : 0.25)); 
                
                if (ghost.isYutaSlash) {
                    ghost.group.scale.set(1 + progress * 2, 1, 1 + progress * 2);
                    ghost.group.children.forEach(c => c.material.opacity = (ghost.life / 0.3) * (c.material.color.getHex() === 0x050011 ? 1.0 : 0.8));
                } else {
                    ghost.group.scale.set(1 - progress, 1 + progress * 1.5, 1 - progress); 
                    ghost.group.children.forEach(c => c.material.opacity = (ghost.life / 0.25) * 0.5);
                }

                if (ghost.life <= 0) { scene.remove(ghost.group); afterimages.splice(i, 1); }
            }

            let distortCount = 0;
            const distortDataArray = [];
            for (let i = activeDistortions.length - 1; i >= 0; i--) {
                let d = activeDistortions[i];
                d.life -= delta;
                if (d.life <= 0) { activeDistortions.splice(i, 1); continue; }
                
                if (distortCount < MAX_DISTORTIONS) {
                    let screenPos = d.pos.clone().project(camera);
                    screenPos.x = (screenPos.x + 1) / 2;
                    screenPos.y = (screenPos.y + 1) / 2;
                    
                    if (screenPos.z < 1.0 && screenPos.z > -1.0) {
                        let currentStrength = d.strength * (d.life / d.maxLife);
                        distortDataArray.push(new THREE.Vector4(screenPos.x, screenPos.y, d.radius, currentStrength));
                        distortCount++;
                    }
                }
            }
            
            if (quality === 'ultra' && distortCount > 0) {
                postMaterial.uniforms.u_time.value = time;
                postMaterial.uniforms.u_distortionCount.value = distortCount;
                for(let i=0; i<distortCount; i++) postMaterial.uniforms.u_distortData.value[i] = distortDataArray[i];
                
                renderer.setRenderTarget(renderTarget);
                renderer.render(scene, camera);
                renderer.setRenderTarget(null);
                renderer.render(postScene, postCamera);
            } else {
                renderer.render(scene, camera);
            }
        }
        
        init(); animate();
    </script>
</body>
</html>
